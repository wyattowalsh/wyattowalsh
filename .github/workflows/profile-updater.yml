name: Unified Profile Updater

on:
  workflow_dispatch:
    inputs:
      metrics_probe_mode:
        description: "Run only the manual full-metrics probe lane"
        type: boolean
        required: false
        default: false
  schedule:
    - cron: "0 1 * * *" # Run once a day at 1 AM UTC
  push:
    branches:
      - master
      - main
      - dev

concurrency:
  group: profile-updater-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  probe-full-metrics:
    name: Probe Full Metrics Surface
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.metrics_probe_mode == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          ref: ${{ github.head_ref || github.ref }}
          fetch-depth: 0

      - name: Set up Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@e4db8464a088ece1b920f60402e813ea4de65b8f # v4

      - name: Install metrics helper dependencies
        run: uv sync --locked

      - name: Probe metrics credentials and upstream availability
        env:
          METRICS_TOKEN: ${{ secrets.METRICS_TOKEN }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_KEY_SECRET: ${{ secrets.X_API_KEY_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
        run: |
          set -euo pipefail

          github_scope_header="missing"
          if [ -n "${METRICS_TOKEN:-}" ]; then
            github_scope_header=$(curl -sS -D - -o /dev/null \
              -H "Authorization: Bearer ${METRICS_TOKEN}" \
              https://api.github.com/user \
              | tr -d '\r' \
              | awk -F': ' 'tolower($1) == "x-oauth-scopes" {print $2}' \
              | tail -n 1)
            [ -n "${github_scope_header}" ] || github_scope_header="present-but-empty"
          fi

          x_oauth1_status="missing"
          if [ -n "${X_API_KEY:-}" ] && [ -n "${X_API_KEY_SECRET:-}" ] && [ -n "${X_ACCESS_TOKEN:-}" ] && [ -n "${X_ACCESS_TOKEN_SECRET:-}" ]; then
            x_oauth1_status="present"
          fi

          {
            echo "### Metrics probe auth summary"
            echo
            echo "- GitHub token scopes: ${github_scope_header}"
            echo "- X OAuth1 credentials: ${x_oauth1_status}"
            echo "- Spotify on lowlighter: never (plugin_music=no; supplemental owns music)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Probe full personal metrics
        id: probe_primary
        continue-on-error: true
        uses: lowlighter/metrics@65836723097537a54cd8eb90f61839426b4266b6 # v3.34
        with:
          output_action: none
          filename: .github/assets/img/metrics.probe.primary.svg
          token: ${{ secrets.METRICS_TOKEN || github.token }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          base: header, activity, community, metadata
          plugin_lines: no
          plugin_isocalendar: yes
          plugin_traffic: yes
          plugin_languages: yes
          plugin_languages_ignored: "jupyter%20notebook"
          plugin_languages_details: "bytes-size, percentage"
          plugin_languages_threshold: "2%"
          # Probe-only diagnostics for upstream habits degradation; production keeps this off.
          plugin_habits: yes
          plugin_habits_from: 1000
          plugin_habits_days: 30
          plugin_habits_facts: yes
          plugin_habits_charts: yes
          plugin_habits_charts_type: classic
          plugin_habits_languages_limit: 8
          plugin_habits_languages_threshold: "0%"
          plugin_notable: yes
          plugin_notable_repositories: yes
          plugin_gists: no
          plugin_topics: yes
          plugin_topics_sort: stars
          plugin_topics_limit: 15
          plugin_music: no
          plugin_achievements: yes
          plugin_achievements_display: compact
          plugin_achievements_threshold: C
          plugin_calendar: yes
          plugin_calendar_limit: 1
          plugin_people: yes
          plugin_people_limit: 12
          plugin_people_types: followers, following
          config_timezone: America/Los_Angeles
          config_padding: 10%

      - name: Collect full personal metrics output
        if: ${{ always() }}
        continue-on-error: true
        run: |
          set -euo pipefail
          cp /metrics_renders/.github/assets/img/metrics.probe.primary.svg ./.github/assets/img/metrics.probe.primary.svg

      - name: Probe full additional metrics
        id: probe_additional
        continue-on-error: true
        uses: lowlighter/metrics@65836723097537a54cd8eb90f61839426b4266b6 # v3.34
        with:
          output_action: none
          filename: .github/assets/img/metrics.probe.additional.svg
          token: ${{ secrets.METRICS_TOKEN || github.token }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          base: ""
          config_timezone: America/Los_Angeles
          config_padding: 10%
          plugin_music: no
          # Probe-only diagnostics for upstream activity degradation; production keeps this off.
          plugin_activity: yes
          plugin_activity_limit: 5
          plugin_activity_days: 14
          plugin_activity_filter: all
          plugin_stargazers: yes
          plugin_stargazers_charts: yes
          plugin_stars: yes
          plugin_stars_limit: 3
          plugin_repositories: yes
          plugin_repositories_featured: "wyattowalsh/agents, wyattowalsh/nbadb, wyattowalsh/proxywhirl, wyattowalsh/mcp-crawl4ai, wyattowalsh/fl-mcp, wyattowalsh/listentropy, wyattowalsh/personal-website, wyattowalsh/mdxpad, wyattowalsh/ai-web-feeds, wyattowalsh/iina-plugin-bookmarks"
          plugin_tweets: no

      - name: Collect full additional metrics output
        if: ${{ always() }}
        continue-on-error: true
        run: |
          set -euo pipefail
          cp /metrics_renders/.github/assets/img/metrics.probe.additional.svg ./.github/assets/img/metrics.probe.additional.svg

      - name: Probe full extra metrics
        id: probe_extra
        continue-on-error: true
        uses: lowlighter/metrics@65836723097537a54cd8eb90f61839426b4266b6 # v3.34
        with:
          output_action: none
          filename: .github/assets/img/metrics.probe.extra.svg
          token: ${{ secrets.METRICS_TOKEN || github.token }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          base: ""
          config_timezone: America/Los_Angeles
          config_padding: 10%
          plugin_music: no
          plugin_reactions: yes
          plugin_reactions_limit: 100
          plugin_reactions_display: relative
          plugin_followup: yes
          plugin_followup_sections: repositories

      - name: Collect full extra metrics output
        if: ${{ always() }}
        continue-on-error: true
        run: |
          set -euo pipefail
          cp /metrics_renders/.github/assets/img/metrics.probe.extra.svg ./.github/assets/img/metrics.probe.extra.svg

      - name: Validate probe outputs
        id: validate_probe_outputs
        if: ${{ always() }}
        continue-on-error: true
        run: |
          set -euo pipefail
          uv run python -m scripts.metrics_svg validate ./.github/assets/img/metrics.probe.primary.svg
          uv run python -m scripts.metrics_svg validate ./.github/assets/img/metrics.probe.additional.svg
          uv run python -m scripts.metrics_svg validate ./.github/assets/img/metrics.probe.extra.svg

      - name: Summarize probe output markers
        if: ${{ always() }}
        run: |
          set -euo pipefail

          summarize_markers() {
            local asset_path="$1"
            shift
            local asset_name
            asset_name=$(basename "$asset_path")

            {
              echo "#### ${asset_name}"
              if [ ! -f "$asset_path" ]; then
                echo "- missing"
                echo
                return
              fi
              for marker in "$@"; do
                if grep -Fq "$marker" "$asset_path"; then
                  echo "- ${marker}: present"
                else
                  echo "- ${marker}: absent"
                fi
              done
              echo
            } >> "$GITHUB_STEP_SUMMARY"
          }

          {
            echo "### Full metrics probe markers"
            echo
          } >> "$GITHUB_STEP_SUMMARY"

          summarize_markers ./.github/assets/img/metrics.probe.primary.svg \
            "Recent coding habits" \
            "Achievements" \
            "Commit calendar" \
            "Followers" \
            "Insufficient token scopes" \
            "Unexpected error"

          summarize_markers ./.github/assets/img/metrics.probe.additional.svg \
            "Recent activity" \
            "Featured repositories" \
            "Recently starred repositories" \
            "Stargazers" \
            "Unexpected error"

          summarize_markers ./.github/assets/img/metrics.probe.extra.svg \
            "Reactions" \
            "Follow-up" \
            "Unexpected error"

      - name: Upload full metrics probe artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4
        with:
          name: metrics-probe-${{ github.run_id }}
          path: |
            .github/assets/img/metrics.probe.primary.svg
            .github/assets/img/metrics.probe.additional.svg
            .github/assets/img/metrics.probe.extra.svg
          if-no-files-found: warn
          retention-days: 7

      - name: Enforce probe success
        if: ${{ always() }}
        run: |
          set -euo pipefail
          [ "${{ steps.probe_primary.outcome }}" = "success" ]
          [ "${{ steps.probe_additional.outcome }}" = "success" ]
          [ "${{ steps.probe_extra.outcome }}" = "success" ]
          [ "${{ steps.validate_probe_outputs.outcome }}" = "success" ]

  update-starred-lists:
    name: Update Starred Repository Lists (MD Files)
    if: >-
      ${{
        github.event.inputs.metrics_probe_mode != 'true' &&
        (
          github.event_name != 'push' ||
          (
            github.event.head_commit.message != 'Updated with Dev Metrics' &&
            github.event.head_commit.message != 'chore(metrics): update generated metrics assets' &&
            github.event.head_commit.message != 'chore(data): update awesome-stars lists (languages.md, topics.md)' &&
            github.event.head_commit.message != 'chore(assets): update generated profile assets' &&
            github.event.head_commit.message != 'art: regenerate living-art assets' &&
            github.event.head_commit.message != 'chore(readme): update dynamic sections and skills badges'
          )
        )
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          ref: ${{ github.head_ref || github.ref }}
          fetch-depth: 0

      - name: Set up Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@e4db8464a088ece1b920f60402e813ea4de65b8f # v4

      - name: Install script-tools dependencies
        run: uv sync --locked --extra script-tools

      - name: Update repo category by language
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          temp_file="$RUNNER_TEMP/languages.md"
          uv run starred --username "${USERNAME}" --token "${GITHUB_TOKEN}" --sort > "$temp_file"
          mv "$temp_file" ./.github/assets/languages.md

      - name: Update repo category by topic
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          temp_file="$RUNNER_TEMP/topics.md"
          uv run starred --username "${USERNAME}" --token "${GITHUB_TOKEN}" --sort \
            --topic --topic_limit 500 > "$temp_file"
          mv "$temp_file" ./.github/assets/topics.md

      - name: Upload starred lists artifact
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4
        with:
          name: starred-lists-${{ github.run_id }}
          path: |
            .github/assets/languages.md
            .github/assets/topics.md
          if-no-files-found: error
          retention-days: 7

  generate-assets:
    name: Generate Profile Assets (QR, WordClouds, Banner)
    runs-on: ubuntu-latest
    needs: update-starred-lists # Depends on the md files being up-to-date
    if: >-
      ${{
        github.event.inputs.metrics_probe_mode != 'true' &&
        !cancelled() &&
        needs.update-starred-lists.result == 'success' &&
        (
          github.event_name != 'push' ||
          (
            github.event.head_commit.message != 'Updated with Dev Metrics' &&
            github.event.head_commit.message != 'chore(metrics): update generated metrics assets' &&
            github.event.head_commit.message != 'chore(data): update awesome-stars lists (languages.md, topics.md)' &&
            github.event.head_commit.message != 'chore(assets): update generated profile assets' &&
            github.event.head_commit.message != 'art: regenerate living-art assets' &&
            github.event.head_commit.message != 'chore(readme): update dynamic sections and skills badges'
          )
        )
      }}
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          ref: ${{ github.head_ref || github.ref }}
          fetch-depth: 0

      - name: Download starred lists artifact
        uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e # v4.2.1
        with:
          name: starred-lists-${{ github.run_id }}
          path: .

      - name: Set up Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@e4db8464a088ece1b920f60402e813ea4de65b8f # v4

      - name: Install Cairo system dependencies
        run: sudo apt-get update && sudo apt-get install -y libcairo2 libcairo2-dev pkg-config libffi-dev

      - name: Install asset generation dependencies
        run: uv sync --locked --extra qr --extra word-clouds

      - name: Generate QR Code
        run: uv run python -m scripts.cli generate qr --config-path config.yaml

      - name: Generate Word Cloud by Topic
        run: |
          uv run python -m scripts.cli generate word-cloud \
            --config-path config.yaml \
            --from-topics-md \
            --output-path .github/assets/img/wordcloud_typographic_by_topics.svg

      - name: Generate Word Cloud by Language
        run: |
          uv run python -m scripts.cli generate word-cloud \
            --config-path config.yaml \
            --from-languages-md \
            --output-path .github/assets/img/wordcloud_typographic_by_languages.svg

      - name: Generate light and dark banners
        run: uv run python -m scripts.cli generate banner --config-path config.yaml

      - name: Upload profile assets artifact
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4
        with:
          name: profile-assets-${{ github.run_id }}
          path: |
            .github/assets/img/qr*.png
            .github/assets/img/wordcloud_*.svg
            .github/assets/img/banner*.svg
          if-no-files-found: error
          retention-days: 7

  update-readme-wakatime:
    # First-party Waka: generate artifact only. Finalize applies the
    # <!--START_SECTION:waka--> … <!--END_SECTION:waka--> zone (sole git writer).
    name: Generate WakaTime README Section
    runs-on: ubuntu-latest
    if: >-
      ${{
        github.event.inputs.metrics_probe_mode != 'true' &&
        (
          github.event_name != 'push' ||
          (
            github.event.head_commit.message != 'Updated with Dev Metrics' &&
            github.event.head_commit.message != 'chore(metrics): update generated metrics assets' &&
            github.event.head_commit.message != 'chore(data): update awesome-stars lists (languages.md, topics.md)' &&
            github.event.head_commit.message != 'chore(assets): update generated profile assets' &&
            github.event.head_commit.message != 'art: regenerate living-art assets' &&
            github.event.head_commit.message != 'chore(readme): update dynamic sections and skills badges'
          )
        )
      }}
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          ref: ${{ github.head_ref || github.ref }}
          fetch-depth: 0

      - name: Set up Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@e4db8464a088ece1b920f60402e813ea4de65b8f # v4

      - name: Install dependencies
        run: uv sync --locked

      - name: Preflight WakaTime auth gate
        id: wakatime_auth
        env:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
        run: |
          set -euo pipefail
          has_wakatime_api_key=false
          [ -n "${WAKATIME_API_KEY:-}" ] && has_wakatime_api_key=true
          echo "has_wakatime_api_key=${has_wakatime_api_key}" >> "$GITHUB_OUTPUT"
          if [ "${has_wakatime_api_key}" != "true" ]; then
            echo "::notice::WAKATIME_API_KEY is missing; writing skip marker for finalize."
          fi

      - name: Generate WakaTime README section artifact
        env:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/waka-readme"
          uv run python -m scripts.cli generate wakatime \
            --output-dir "$RUNNER_TEMP/waka-readme" \
            --github-login "${{ github.repository_owner }}" \
            --allow-missing-key

      - name: Upload WakaTime README section artifact
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4
        with:
          name: waka-readme-${{ github.run_id }}
          path: ${{ runner.temp }}/waka-readme
          if-no-files-found: error
          retention-days: 7

  generate-profile-metrics:
    name: Generate Profile Metrics SVGs
    if: >-
      ${{
        github.event.inputs.metrics_probe_mode != 'true' &&
        (
          github.event_name != 'push' ||
          (
            github.event.head_commit.message != 'Updated with Dev Metrics' &&
            github.event.head_commit.message != 'chore(metrics): update generated metrics assets' &&
            github.event.head_commit.message != 'chore(data): update awesome-stars lists (languages.md, topics.md)' &&
            github.event.head_commit.message != 'chore(assets): update generated profile assets' &&
            github.event.head_commit.message != 'art: regenerate living-art assets' &&
            github.event.head_commit.message != 'chore(readme): update dynamic sections and skills badges'
          )
        )
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          ref: ${{ github.head_ref || github.ref }}
          fetch-depth: 0
      - name: Set up Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Install uv
        uses: astral-sh/setup-uv@e4db8464a088ece1b920f60402e813ea4de65b8f # v4
      - name: Install metrics helper dependencies
        run: uv sync --locked
      - name: Preflight metrics auth gates
        id: metrics_auth
        env:
          METRICS_TOKEN: ${{ secrets.METRICS_TOKEN }}
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_KEY_SECRET: ${{ secrets.X_API_KEY_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
        run: |
          set -euo pipefail
          # Secret setup guidance (see .github/SECURITY.md):
          # - METRICS_TOKEN: prefer a fine-grained PAT (Metadata/Contents/Profile: Read;
          #   org membership Read only if needed). Classic fallback: read:user, public_repo
          #   (+ read:org). Never grant write/admin/workflow. Used only as lowlighter
          #   `token:` / first-party GraphQL reads — never as a catch-all PAT.
          # - Spotify / X secrets: first-party supplemental cards only (env: on the
          #   generate supplemental-metrics run step). Never pass them into
          #   lowlighter/metrics (or any metrics fork) `with:` inputs.
          has_metrics_token=false
          [ -n "${METRICS_TOKEN:-}" ] && has_metrics_token=true
          has_spotify_tokens=false
          if [ -n "${SPOTIFY_CLIENT_ID:-}" ] && [ -n "${SPOTIFY_CLIENT_SECRET:-}" ] && [ -n "${SPOTIFY_REFRESH_TOKEN:-}" ]; then
            has_spotify_tokens=true
          fi
          has_x_oauth1_tokens=false
          if [ -n "${X_API_KEY:-}" ] && [ -n "${X_API_KEY_SECRET:-}" ] && [ -n "${X_ACCESS_TOKEN:-}" ] && [ -n "${X_ACCESS_TOKEN_SECRET:-}" ]; then
            has_x_oauth1_tokens=true
          fi
          echo "has_metrics_token=${has_metrics_token}" >> "$GITHUB_OUTPUT"
          echo "has_spotify_tokens=${has_spotify_tokens}" >> "$GITHUB_OUTPUT"
          echo "has_x_oauth1_tokens=${has_x_oauth1_tokens}" >> "$GITHUB_OUTPUT"
          if [ "${has_metrics_token}" != "true" ]; then
            echo "::notice::METRICS_TOKEN is missing; repositories-sensitive lowlighter plugins are disabled."
          fi
          if [ "${has_spotify_tokens}" != "true" ]; then
            echo "::notice::Spotify secrets are incomplete; first-party metrics-music.svg supplemental card is disabled."
          fi
          if [ "${has_x_oauth1_tokens}" != "true" ]; then
            echo "::notice::X OAuth1 secrets are incomplete; first-party metrics-posts.svg supplemental card is disabled."
          fi
      - name: Back up existing metrics assets
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/metrics-backups"

          backup_metric() {
            local source_path="$1"
            local backup_path="$2"

            if [ -f "$source_path" ]; then
              cp "$source_path" "$backup_path"
              echo "::notice::Backed up $(basename "$source_path") to ${backup_path}."
            else
              rm -f "$backup_path"
              echo "::notice::No existing $(basename "$source_path") asset found to back up."
            fi
          }

          backup_metric ./.github/assets/img/metrics.svg "$RUNNER_TEMP/metrics-backups/metrics.svg"
          backup_metric ./.github/assets/img/metrics.additional.svg "$RUNNER_TEMP/metrics-backups/metrics.additional.svg"
          backup_metric ./.github/assets/img/metrics.extra.svg "$RUNNER_TEMP/metrics-backups/metrics.extra.svg"
          rm -f ./.github/assets/img/metrics.svg ./.github/assets/img/metrics.additional.svg ./.github/assets/img/metrics.extra.svg
      # Third-party lowlighter only: read-scoped METRICS_TOKEN (or github.token).
      # No Spotify / X / write PATs in `with:` — plugin_music stays no.
      - name: Personal metrics
        id: lowlighter_metrics_primary
        continue-on-error: true
        uses: lowlighter/metrics@65836723097537a54cd8eb90f61839426b4266b6 # v3.34
        with:
          output_action: none
          filename: .github/assets/img/metrics.svg
          token: ${{ secrets.METRICS_TOKEN || github.token }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          base: header, activity, community, metadata
          # Disabled until upstream handles bot/system authors without throwing.
          plugin_lines: no
          plugin_isocalendar: yes
          plugin_traffic: ${{ steps.metrics_auth.outputs.has_metrics_token == 'true' && 'yes' || 'no' }}
          plugin_languages: yes
          plugin_languages_ignored: "jupyter%20notebook"
          plugin_languages_details: "bytes-size, percentage"
          plugin_languages_threshold: "2%"
          # The habits panel still emits inline errors in upstream renders; use
          # the repo-owned supplemental card instead.
          plugin_habits: no
          plugin_habits_from: 1000
          plugin_habits_days: 30
          plugin_habits_facts: yes
          plugin_habits_charts: yes
          plugin_habits_charts_type: classic
          plugin_habits_languages_limit: 8
          plugin_habits_languages_threshold: "0%"
          plugin_notable: yes
          plugin_notable_repositories: ${{ steps.metrics_auth.outputs.has_metrics_token == 'true' && 'yes' || 'no' }}
          # GitHub Actions tokens cannot read gists reliably for this account.
          plugin_gists: no
          plugin_topics: yes
          plugin_topics_sort: stars
          plugin_topics_limit: 15
          plugin_music: no
          # Compact GitHub-native panels promoted from probe (height-safe for primary).
          plugin_achievements: yes
          plugin_achievements_display: compact
          plugin_achievements_threshold: C
          plugin_achievements_limit: 12
          plugin_calendar: yes
          plugin_calendar_limit: 1
          config_timezone: America/Los_Angeles
          config_padding: 10%

      - name: Collect personal metrics output
        id: collect_personal_metrics
        if: ${{ always() }}
        continue-on-error: true
        run: |
          set -euo pipefail
          cp /metrics_renders/.github/assets/img/metrics.svg ./.github/assets/img/metrics.svg

      - name: Validate personal metrics output
        id: validate_personal_metrics
        if: ${{ always() }}
        continue-on-error: true
        run: uv run python -m scripts.metrics_svg validate ./.github/assets/img/metrics.svg

      - name: Recover personal metrics output
        id: recover_personal_metrics
        if: ${{ always() }}
        run: |
          uv run python -m scripts.metrics_svg recover \
            ./.github/assets/img/metrics.svg \
            --previous "$RUNNER_TEMP/metrics-backups/metrics.svg"

      - name: Personal metrics (additional)
        id: lowlighter_metrics_additional
        continue-on-error: true
        uses: lowlighter/metrics@65836723097537a54cd8eb90f61839426b4266b6 # v3.34
        with:
          output_action: none
          filename: .github/assets/img/metrics.additional.svg
          token: ${{ secrets.METRICS_TOKEN || github.token }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          base: ""
          config_timezone: America/Los_Angeles
          config_padding: 10%
          # Keep this card on stable GitHub-native panels; music/activity stay
          # off — supplemental cards own those surfaces.
          plugin_music: no
          plugin_activity: no
          plugin_stargazers: ${{ steps.metrics_auth.outputs.has_metrics_token == 'true' && 'yes' || 'no' }}
          plugin_stargazers_charts: yes
          plugin_stars: ${{ steps.metrics_auth.outputs.has_metrics_token == 'true' && 'yes' || 'no' }}
          plugin_stars_limit: ${{ steps.metrics_auth.outputs.has_metrics_token == 'true' && '3' || '0' }}
          plugin_repositories: yes
          plugin_repositories_featured: "wyattowalsh/agents, wyattowalsh/nbadb, wyattowalsh/proxywhirl, wyattowalsh/mcp-crawl4ai, wyattowalsh/fl-mcp, wyattowalsh/listentropy, wyattowalsh/personal-website, wyattowalsh/mdxpad, wyattowalsh/ai-web-feeds, wyattowalsh/iina-plugin-bookmarks"
          plugin_people: yes
          plugin_people_limit: 12
          plugin_people_size: 24
          plugin_people_types: followers, following
          plugin_tweets: no
          plugin_gists: no
          plugin_habits: no

      - name: Collect additional metrics output
        id: collect_additional_metrics
        if: ${{ always() }}
        continue-on-error: true
        run: |
          set -euo pipefail
          cp /metrics_renders/.github/assets/img/metrics.additional.svg ./.github/assets/img/metrics.additional.svg

      - name: Validate additional metrics output
        id: validate_additional_metrics
        if: ${{ always() }}
        continue-on-error: true
        run: uv run python -m scripts.metrics_svg validate ./.github/assets/img/metrics.additional.svg

      - name: Recover additional metrics output
        id: recover_additional_metrics
        if: ${{ always() }}
        run: |
          uv run python -m scripts.metrics_svg recover \
            ./.github/assets/img/metrics.additional.svg \
            --previous "$RUNNER_TEMP/metrics-backups/metrics.additional.svg"

      - name: Personal metrics (extra / overflow)
        id: lowlighter_metrics_extra
        continue-on-error: true
        uses: lowlighter/metrics@65836723097537a54cd8eb90f61839426b4266b6 # v3.34
        with:
          output_action: none
          filename: .github/assets/img/metrics.extra.svg
          token: ${{ secrets.METRICS_TOKEN || github.token }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          base: ""
          config_timezone: America/Los_Angeles
          config_padding: 10%
          plugin_music: no
          plugin_activity: no
          plugin_habits: no
          plugin_gists: no
          plugin_tweets: no
          # Overflow panels split out to keep primary/additional README height manageable.
          plugin_reactions: yes
          plugin_reactions_limit: 100
          plugin_reactions_display: relative
          plugin_followup: yes
          plugin_followup_sections: repositories

      - name: Collect extra metrics output
        id: collect_extra_metrics
        if: ${{ always() }}
        continue-on-error: true
        run: |
          set -euo pipefail
          cp /metrics_renders/.github/assets/img/metrics.extra.svg ./.github/assets/img/metrics.extra.svg

      - name: Validate extra metrics output
        id: validate_extra_metrics
        if: ${{ always() }}
        continue-on-error: true
        run: uv run python -m scripts.metrics_svg validate ./.github/assets/img/metrics.extra.svg

      - name: Recover extra metrics output
        id: recover_extra_metrics
        if: ${{ always() }}
        run: |
          uv run python -m scripts.metrics_svg recover \
            ./.github/assets/img/metrics.extra.svg \
            --previous "$RUNNER_TEMP/metrics-backups/metrics.extra.svg"

      # First-party only: Spotify/X via env: on this run step (never lowlighter with:).
      - name: Generate supplemental metrics cards
        id: generate_supplemental_metrics
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          METRICS_TOKEN: ${{ secrets.METRICS_TOKEN }}
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_KEY_SECRET: ${{ secrets.X_API_KEY_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
        run: |
          set -euo pipefail
          uv run python -m scripts.cli generate supplemental-metrics \
            --config-path config.yaml \
            --owner "${{ github.repository_owner }}" \
            --repo "${{ github.event.repository.name }}" \
            --output-dir .github/assets/img \
            --manifest-path "$RUNNER_TEMP/metrics-supplemental.manifest.json" \
            --x-handle "${{ github.repository_owner }}"

      - name: Validate supplemental metrics cards
        id: validate_supplemental_metrics
        if: ${{ always() }}
        run: |
          set -euo pipefail
          uv run python -m scripts.supplemental_metrics validate \
            --output-dir .github/assets/img \
            --manifest-path "$RUNNER_TEMP/metrics-supplemental.manifest.json"

      - name: Validate final metrics assets
        id: validate_final_metrics
        if: ${{ always() }}
        run: |
          set -euo pipefail
          uv run python -m scripts.metrics_svg validate ./.github/assets/img/metrics.svg
          uv run python -m scripts.metrics_svg validate ./.github/assets/img/metrics.additional.svg
          uv run python -m scripts.metrics_svg validate ./.github/assets/img/metrics.extra.svg
          uv run python -m scripts.supplemental_metrics validate \
            --output-dir .github/assets/img \
            --manifest-path "$RUNNER_TEMP/metrics-supplemental.manifest.json"

      - name: Summarize metrics asset health
        if: ${{ always() }}
        run: |
          uv run python - <<'PY'
          from pathlib import Path
          from scripts.metrics_svg import validate_svg_file

          for asset_name in (
              "metrics.svg",
              "metrics.additional.svg",
              "metrics.extra.svg",
              "metrics-habits.svg",
              "metrics-activity.svg",
              "metrics-music.svg",
              "metrics-posts.svg",
          ):
              path = Path(".github/assets/img") / asset_name
              result = validate_svg_file(path)
              print(f"{asset_name}: status={result.status.value} detail={result.detail}")
              if asset_name in {"metrics-music.svg", "metrics-posts.svg"} and result.status.value == "missing":
                  continue
              if not result.is_valid:
                  print(f"::error::{asset_name} is in degraded state ({result.status.value}).")
          PY

      - name: Upload profile metrics artifact
        if: ${{ success() && steps.validate_final_metrics.outcome == 'success' }}
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4
        with:
          name: profile-metrics-${{ github.run_id }}
          path: |
            .github/assets/img/metrics.svg
            .github/assets/img/metrics.additional.svg
            .github/assets/img/metrics.extra.svg
            .github/assets/img/metrics-habits.svg
            .github/assets/img/metrics-activity.svg
            .github/assets/img/metrics-music.svg
            .github/assets/img/metrics-posts.svg
          if-no-files-found: error
          retention-days: 7

  generate-event-art:
    name: Generate Event-Driven Artwork
    runs-on: ubuntu-latest
    needs: update-starred-lists
    if: >-
      ${{
        github.event.inputs.metrics_probe_mode != 'true' &&
        !cancelled() &&
        needs.update-starred-lists.result == 'success' &&
        (
          github.event_name != 'push' ||
          (
            github.event.head_commit.message != 'Updated with Dev Metrics' &&
            github.event.head_commit.message != 'chore(metrics): update generated metrics assets' &&
            github.event.head_commit.message != 'chore(data): update awesome-stars lists (languages.md, topics.md)' &&
            github.event.head_commit.message != 'chore(assets): update generated profile assets' &&
            github.event.head_commit.message != 'art: regenerate living-art assets' &&
            github.event.head_commit.message != 'chore(readme): update dynamic sections and skills badges'
          )
        )
      }}
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          ref: ${{ github.head_ref || github.ref }}

      - name: Set up Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@e4db8464a088ece1b920f60402e813ea4de65b8f # v4

      - name: Install dependencies
        run: uv sync --locked --all-extras

      - name: Install librsvg for GIF rasterization
        run: sudo apt-get update && sudo apt-get install -y librsvg2-bin

      - name: Prepare living-art staging directory
        run: |
          mkdir -p "$RUNNER_TEMP/living-art-stage/inputs"
          mkdir -p "$RUNNER_TEMP/living-art-stage/outputs"

      - name: Fetch metrics
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          uv run python -m scripts.fetch_metrics \
            --owner "$OWNER" \
            --repo "$REPO_NAME" \
            --output "$RUNNER_TEMP/metrics.json"
          cp "$RUNNER_TEMP/metrics.json" "$RUNNER_TEMP/living-art-stage/inputs/metrics.json"

      - name: Fetch historical data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          uv run python -m scripts.fetch_history \
            --owner "$OWNER" \
            --repo "$REPO_NAME" \
            --output "$RUNNER_TEMP/history.json"
          cp "$RUNNER_TEMP/history.json" "$RUNNER_TEMP/living-art-stage/inputs/history.json"

      - name: Resolve living-art runtime contract constants
        run: |
          uv run python - <<'PY'
          import os
          from scripts.art.timelapse import (
              DEFAULT_PUBLISHED_MAX_FRAMES,
              MIN_PUBLISHED_RUNTIME_MS,
          )

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env_file:
              env_file.write(f"LIVING_ART_MAX_FRAMES={DEFAULT_PUBLISHED_MAX_FRAMES}\n")
              env_file.write(f"LIVING_ART_MIN_RUNTIME_MS={MIN_PUBLISHED_RUNTIME_MS}\n")
          PY

      - name: Generate living-art outputs (canonical timelapse GIFs)
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          uv run python -m scripts.cli generate living-art \
            --profile "$OWNER" \
            --metrics-path "$RUNNER_TEMP/metrics.json" \
            --history-path "$RUNNER_TEMP/history.json" \
            --max-frames "$LIVING_ART_MAX_FRAMES"

      - name: Validate living-art runtime and frame contracts
        run: |
          uv run python - <<'PY'
          import os
          from pathlib import Path
          from PIL import Image, ImageSequence

          max_frames = int(os.environ["LIVING_ART_MAX_FRAMES"])
          min_runtime_ms = int(os.environ["LIVING_ART_MIN_RUNTIME_MS"])
          gif_paths = sorted(Path(".github/assets/img").glob("living-*.gif"))
          if not gif_paths:
              raise SystemExit("No living-art GIF outputs found for contract validation")

          print("Living-art runtime contract summary:")
          for gif_path in gif_paths:
              with Image.open(gif_path) as img:
                  durations = []
                  for frame_index, frame in enumerate(ImageSequence.Iterator(img)):
                      raw_duration = frame.info.get("duration", 0)
                      try:
                          duration = int(raw_duration)
                      except (TypeError, ValueError):
                          duration = 0
                      if duration <= 0:
                          raise SystemExit(
                              f"{gif_path.name} frame {frame_index} has invalid duration {raw_duration!r}"
                          )
                      durations.append(duration)
              frame_count = len(durations)
              runtime_ms = sum(durations)
              print(f"- {gif_path.name}: frames={frame_count}, runtime_ms={runtime_ms}")
              if frame_count > max_frames:
                  raise SystemExit(
                      f"{gif_path.name} has {frame_count} frames, exceeds max contract {max_frames}"
                  )
              if runtime_ms < min_runtime_ms:
                  raise SystemExit(
                      f"{gif_path.name} runtime {runtime_ms}ms below contract floor {min_runtime_ms}ms"
                  )
          PY

      - name: Stage living-art timelapse outputs and index
        if: ${{ always() }}
        run: |
          shopt -s nullglob
          mkdir -p "$RUNNER_TEMP/living-art-stage/outputs/timelapse"
          mkdir -p "$RUNNER_TEMP/living-art-stage/outputs/index"
          mkdir -p "$RUNNER_TEMP/living-art-stage/outputs/docs-showcase"
          for file in .github/assets/img/living-*.gif; do
            cp "$file" "$RUNNER_TEMP/living-art-stage/outputs/timelapse/"
          done
          for file in .github/assets/img/living-art-manifest.json .github/assets/img/living-art-preview.html; do
            if [[ -f "$file" ]]; then
              cp "$file" "$RUNNER_TEMP/living-art-stage/outputs/index/"
            fi
          done
          for file in docs/public/showcase/living-*.gif; do
            cp "$file" "$RUNNER_TEMP/living-art-stage/outputs/docs-showcase/"
          done
          for file in docs/public/showcase/living-art-manifest.json docs/public/showcase/living-art-preview.html; do
            if [[ -f "$file" ]]; then
              cp "$file" "$RUNNER_TEMP/living-art-stage/outputs/docs-showcase/"
            fi
          done

      - name: Stage living-art outputs and manifest
        if: ${{ always() }}
        run: |
          {
            echo "# Living-art artifact summary"
            echo
            echo "## Inputs"
            find "$RUNNER_TEMP/living-art-stage/inputs" -type f | sort | while read -r file; do
              size=$(wc -c < "$file")
              echo "- $(basename "$file") (${size} bytes)"
            done
            echo
            echo "## Outputs"
            find "$RUNNER_TEMP/living-art-stage/outputs" -type f | sort | while read -r file; do
              size=$(wc -c < "$file")
              rel=${file#"$RUNNER_TEMP/living-art-stage/"}
              echo "- ${rel} (${size} bytes)"
            done
          } | tee "$RUNNER_TEMP/living-art-stage/manifest.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload living-art staging bundle
        if: ${{ always() }}
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4
        with:
          name: living-art-stage-${{ github.run_id }}
          path: ${{ runner.temp }}/living-art-stage
          if-no-files-found: warn
          retention-days: 7


  finalize:
    # Single first-party git writer: downloads generator artifacts and commits/pushes.
    # Graph: assets ∥ art ∥ metrics ∥ waka → finalize (apply waka zone, then README/skills)
    name: Finalize Profile Asset Commits
    runs-on: ubuntu-latest
    needs:
      - update-starred-lists
      - generate-assets
      - generate-event-art
      - generate-profile-metrics
      - update-readme-wakatime
    if: >-
      ${{
        github.event.inputs.metrics_probe_mode != 'true' &&
        !cancelled() &&
        needs.update-starred-lists.result == 'success' &&
        needs.generate-assets.result == 'success' &&
        needs.generate-event-art.result == 'success' &&
        needs.generate-profile-metrics.result == 'success' &&
        needs.update-readme-wakatime.result == 'success' &&
        (
          github.event_name != 'push' ||
          (
            github.event.head_commit.message != 'Updated with Dev Metrics' &&
            github.event.head_commit.message != 'chore(metrics): update generated metrics assets' &&
            github.event.head_commit.message != 'chore(data): update awesome-stars lists (languages.md, topics.md)' &&
            github.event.head_commit.message != 'chore(assets): update generated profile assets' &&
            github.event.head_commit.message != 'art: regenerate living-art assets' &&
            github.event.head_commit.message != 'chore(readme): update dynamic sections and skills badges'
          )
        )
      }}
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          ref: ${{ github.head_ref || github.ref }}
          fetch-depth: 0

      - name: Download starred lists artifact
        uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e # v4.2.1
        with:
          name: starred-lists-${{ github.run_id }}
          path: .

      - name: Download profile assets artifact
        uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e # v4.2.1
        with:
          name: profile-assets-${{ github.run_id }}
          path: .

      - name: Download living-art staging artifact
        uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e # v4.2.1
        with:
          name: living-art-stage-${{ github.run_id }}
          path: ${{ runner.temp }}/living-art-stage

      - name: Apply living-art outputs from staging artifact
        run: |
          set -euo pipefail
          shopt -s nullglob
          stage="${{ runner.temp }}/living-art-stage"
          mkdir -p .github/assets/img docs/public/showcase
          for file in "$stage"/outputs/timelapse/living-*.gif; do
            cp "$file" .github/assets/img/
          done
          for file in "$stage"/outputs/index/living-art-manifest.json \
                      "$stage"/outputs/index/living-art-preview.html; do
            if [[ -f "$file" ]]; then
              cp "$file" .github/assets/img/
            fi
          done
          for file in "$stage"/outputs/docs-showcase/living-*.gif; do
            cp "$file" docs/public/showcase/
          done
          for file in "$stage"/outputs/docs-showcase/living-art-manifest.json \
                      "$stage"/outputs/docs-showcase/living-art-preview.html; do
            if [[ -f "$file" ]]; then
              cp "$file" docs/public/showcase/
            fi
          done

      - name: Download profile metrics artifact
        uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e # v4.2.1
        with:
          name: profile-metrics-${{ github.run_id }}
          path: .

      - name: Download WakaTime README section artifact
        uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e # v4.2.1
        with:
          name: waka-readme-${{ github.run_id }}
          path: ${{ runner.temp }}/waka-readme

      - name: Set up Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@e4db8464a088ece1b920f60402e813ea4de65b8f # v4

      - name: Install dependencies
        run: uv sync --locked --all-extras

      - name: Apply WakaTime README section
        run: |
          set -euo pipefail
          uv run python -m scripts.wakatime_readme apply \
            --artifact "${{ runner.temp }}/waka-readme/waka-section.md" \
            --readme README.md

      - name: Generate README Sections
        run: uv run python -m scripts.cli generate readme-sections --config-path config.yaml

      - name: Generate Skills Badges
        run: uv run python -m scripts.cli generate skills --skills-path skills.yaml

      - name: Commit and push owned profile artifacts
        env:
          TARGET_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          set -euo pipefail
          shopt -s nullglob

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          commit_group() {
            local message="$1"
            shift
            local owned_files=("$@")
            if [ "${#owned_files[@]}" -eq 0 ]; then
              echo "Skipping empty group for: ${message}"
              return 0
            fi
            if [ -z "$(git status --porcelain --untracked-files=all -- "${owned_files[@]}")" ]; then
              echo "No changes for: ${message}"
              return 0
            fi
            git add -- "${owned_files[@]}"
            git commit -m "${message}"
          }

          commit_group "chore(data): update awesome-stars lists (languages.md, topics.md)" \
            ./.github/assets/languages.md \
            ./.github/assets/topics.md

          asset_files=(.github/assets/img/qr*.png .github/assets/img/wordcloud_*.svg .github/assets/img/banner*.svg)
          commit_group "chore(assets): update generated profile assets" "${asset_files[@]}"

          art_files=(
            .github/assets/img/living-*.gif
            .github/assets/img/living-art-manifest.json
            .github/assets/img/living-art-preview.html
            docs/public/showcase/living-*.gif
            docs/public/showcase/living-art-manifest.json
            docs/public/showcase/living-art-preview.html
          )
          commit_group "art: regenerate living-art assets" "${art_files[@]}"

          metrics_files=(
            ./.github/assets/img/metrics.svg
            ./.github/assets/img/metrics.additional.svg
            ./.github/assets/img/metrics.extra.svg
            ./.github/assets/img/metrics-habits.svg
            ./.github/assets/img/metrics-activity.svg
            ./.github/assets/img/metrics-music.svg
            ./.github/assets/img/metrics-posts.svg
          )
          # Only add paths that exist or are tracked.
          metrics_existing=()
          for file in "${metrics_files[@]}"; do
            if [ -e "$file" ] || git ls-files --error-unmatch "$file" >/dev/null 2>&1; then
              metrics_existing+=("$file")
            fi
          done
          if [ "${#metrics_existing[@]}" -gt 0 ]; then
            if [ -n "$(git status --porcelain --untracked-files=all -- "${metrics_existing[@]}")" ]; then
              git add -A -- "${metrics_existing[@]}"
              git commit -m "chore(metrics): update generated metrics assets"
            else
              echo "No changes for: chore(metrics): update generated metrics assets"
            fi
          fi

          readme_files=(README.md .github/assets/img/readme/*.svg)
          commit_group "chore(readme): update dynamic sections and skills badges" "${readme_files[@]}"

          if git rev-parse --verify "origin/${TARGET_BRANCH}" >/dev/null 2>&1; then
            ahead="$(git rev-list --count "origin/${TARGET_BRANCH}..HEAD" || echo 0)"
          else
            ahead="$(git rev-list --count HEAD)"
          fi
          if [ "${ahead}" = "0" ]; then
            echo "No finalize commits to push."
            exit 0
          fi

          for attempt in 1 2 3; do
            if git push origin "HEAD:${TARGET_BRANCH}"; then
              exit 0
            fi

            if [ "$attempt" -eq 3 ]; then
              echo "::error::Failed to push finalize commits after ${attempt} attempts."
              exit 1
            fi

            git fetch origin "${TARGET_BRANCH}"
            git rebase "origin/${TARGET_BRANCH}"
          done
