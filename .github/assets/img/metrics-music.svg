<rect x="12" y="10" width="44" height="44" rx="10" fill="none" stroke="var(--accent)" stroke-opacity="0.45" stroke-width="1.5" />
<text class="extra-title" x="68" y="28">Melancholia</text>
<text class="muted" x="68" y="46">Wasted Penguinz · Melancholia · Apr 22</text>
<rect class="panel" x="580" y="0" width="564" height="64" rx="10" />
<rect class="panel-stroke" x="580" y="0" width="564" height="64" rx="10" />
<rect x="592" y="10" width="44" height="44" rx="10" fill="#1a7f37" />
<text class="hero-artist" x="614" y="38" text-anchor="middle" fill="#ffffff">CS</text>
<rect x="592" y="10" width="44" height="44" rx="10" fill="none" stroke="var(--accent)" stroke-opacity="0.45" stroke-width="1.5" />
<text class="extra-title" x="648" y="28">Traveling</text>
<text class="muted" x="648" y="46">Coone, Scope DJ · Apr 22</text>
</g>
</svg>
