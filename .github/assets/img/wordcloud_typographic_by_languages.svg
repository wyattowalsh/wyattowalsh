<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="520" viewBox="0 0 1600 520">
  <defs>
    <filter id="wc-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="glow1" />
      <feGaussianBlur in="SourceGraphic" stdDeviation="0.8" result="glow2" />
      <feMerge>
        <feMergeNode in="glow1" />
        <feMergeNode in="glow2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="wc-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1" stdDeviation="0.5" flood-color="#00000020" />
    </filter>
    <radialGradient id="wc-bg-grad" cx="50%" cy="50%" r="75%">
      <stop stop-color="#fafbfc" stop-opacity="1" offset="0%" />
      <stop stop-color="#f0f1f3" stop-opacity="1" offset="100%" />
    </radialGradient>
    <radialGradient id="wc-bg-grad-dark" cx="50%" cy="50%" r="75%">
      <stop stop-color="#161b22" stop-opacity="1" offset="0%" />
      <stop stop-color="#0d1117" stop-opacity="1" offset="100%" />
    </radialGradient>
  </defs>
  <style>:root { color-scheme: light dark; }
@media (prefers-color-scheme: dark) {
  .wc-bg { fill: url(#wc-bg-grad-dark); }
}
</style>
