<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-label="WakaTime coding activity">
<defs>
<style>
:root {
  --canvas-bg: #ffffff;
  --card-bg: #ffffff;
  --card-border: #d0d7de;
  --title-color: #1f2328;
  --text-color: #656d76;
  --meta-color: #656d76;
  --accent: #0969da;
  --bar-track: #eaeef2;
  --hm-0: #ebedf0;
  --hm-1: #9be9a8;
  --hm-2: #40c463;
  --hm-3: #30a14e;
  --hm-4: #216e39;
}
@media (prefers-color-scheme: dark) { :root {
  --canvas-bg: #0d1117;
  --card-bg: #0d1117;
  --card-border: #30363d;
  --title-color: #e6edf3;
  --text-color: #8b949e;
  --meta-color: #8b949e;
  --accent: #58a6ff;
  --bar-track: #21262d;
  --hm-0: #161b22;
  --hm-1: #0e4429;
  --hm-2: #006d32;
  --hm-3: #26a641;
  --hm-4: #39d353;
}}
.rc-bg { fill: var(--card-bg); }
.rc-border { stroke: var(--card-border); }
.card-title { fill: var(--title-color); font: 700 18px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; }
.card-kicker { fill: var(--meta-color); font: 700 11px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; letter-spacing: 0.08em; text-transform: uppercase; }
.card-line { fill: var(--text-color); font: 400 13px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; }
.card-meta { fill: var(--meta-color); font: 400 12px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; }
.stat-name { fill: var(--title-color); font: 600 12px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; }
.stat-time { fill: var(--meta-color); font: 400 11px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; }
.total-label { fill: var(--meta-color); font: 600 11px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; letter-spacing: 0.04em; text-transform: uppercase; }
.total-value { fill: var(--title-color); font: 700 16px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; }
.bar-track { fill: var(--bar-track); }
.hm-0 { fill: var(--hm-0); }
.hm-1 { fill: var(--hm-1); }
.hm-2 { fill: var(--hm-2); }
.hm-3 { fill: var(--hm-3); }
.hm-4 { fill: var(--hm-4); }
</style>
