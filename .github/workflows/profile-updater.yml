      - name: Download living-art staging artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        env:
          # Remove after actions/download-artifact#484 is fixed in a reviewed pin.
          NODE_OPTIONS: --disable-warning=DEP0005
        with:
