[project]
name = "readme"
version = "0.1.0"
description = "github profile repo"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "email-validator>=2.3.0",
    "loguru>=0.7.3",
    "noise>=1.2.2",
    "numpy>=2.2.6",
    "pillow>=12.1.1",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.13.1",
    "pyyaml>=6.0.3",
    "rich>=14.3.3",
    "typer>=0.24.1",
    "defusedxml>=0.7.1",
]

[project.scripts]
readme = "scripts.cli:app"

[project.optional-dependencies]
format = [
    "ruff>=0.15.8",
]
lint = [
    "pylint>=4.0.5",
    "ruff>=0.15.8",
    "readme[qr]",
    "readme[word-clouds]",
    "ty>=0.0.29",
]
qr = [
    "cairosvg>=2.9.0",
    "qrcode-artistic>=3.0.2",
    "segno>=1.6.6",
]
# Heavy numeric / optimization stack: living-art (scipy) + mealpy word-cloud solvers.
# Install via `uv sync --extra science` or `--all-extras` (CI living-art / lint-test).
science = [
    "matplotlib>=3.10.8",
    "mealpy>=3.0.1",
    "scipy>=1.16.3",
]
test = [
    "hypothesis>=6.151.10",
    "pytest>=9.0.2",
    "pytest-benchmark>=5.2.3",
    "pytest-cov>=7.1.0",
    "pytest-emoji>=0.2.0",
    "pytest-html>=4.2.0",
    "pytest-icdiff>=0.9",
    "pytest-instafail>=0.5.0",
    "pytest-mock>=3.15.1",
    "pytest-sugar>=1.1.1",
    "pytest-timeout>=2.4.0",
    "pytest-xdist>=3.8.0",
    "readme[qr]",
    "readme[word-clouds]",
    "syrupy>=5.5.3",
]
word-clouds = [
    "beautifulsoup4>=4.14.3",
    "fonttools>=4.62.1",
    "markdown>=3.10.2",
    "readme[science]",
    "wordcloud>=1.9.6",
]
dev = [
    "readme[format,lint,test]",
]

[tool.pytest.ini_options]
addopts = "-n auto --verbose --hypothesis-show-statistics --emoji --instafail --cov=./scripts --cov-fail-under=95.0"
testpaths = ["tests"]
console_output_style = "progress"
junit_logging = "all"
log_cli = true
log_cli_date_format = "%Y-%m-%d %H:%M:%S"
log_cli_format = "%(asctime)s - [%(levelname)s] - %(name)s - (%(filename)s).%(funcName)s(%(lineno)d) - %(message)s"
log_cli_level = "DEBUG"
log_file_date_format = "%Y-%m-%d %H:%M:%S"
log_file_format = "%(asctime)s - [%(levelname)s] - %(name)s - (%(filename)s).%(funcName)s(%(lineno)d) - %(message)s"
log_file_level = "DEBUG"
log_format = "%(asctime)s - [%(levelname)s] - %(name)s - (%(filename)s).%(funcName)s(%(lineno)d) - %(message)s"
log_level = "DEBUG"
required_plugins = ["pytest-sugar", "pytest-html", "pytest-emoji", "pytest-icdiff", "pytest-instafail", "pytest-timeout", "pytest-benchmark", "pytest-cov"]
timeout = 500

[tool.coverage.run]
data_file = "${COVERAGE_FILE-logs/.coverage}"

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["scripts"]

[tool.pylint.main]
fail-under = 8.0
jobs = 0

[tool.pylint."messages control"]
disable = [
    "cyclic-import",  # intentional package graph (generate domains ↔ _common)
    "duplicate-code",  # noisy across parallel test modules
    "import-outside-toplevel",  # intentional lazy imports for optional extras
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["scripts*"]

[tool.uv]
package = true

[tool.ty.environment]
python-version = "3.13"

[tool.ty.src]
include = ["scripts", "tests"]

[tool.ty.rules]
all = "error"

[[tool.ty.overrides]]
include = [
    "scripts/art/daily_snapshots.py",
    "scripts/cli/config_cmd.py",
    "scripts/cli/dev.py",
    "scripts/cli/generate/_common.py",
    "scripts/cli/generate/all_cmd.py",
    "scripts/cli/generate/art.py",
    "scripts/cli/generate/banner.py",
    "scripts/cli/generate/qr.py",
    "scripts/cli/generate/readme_cmd.py",
    "scripts/cli/generate/word_cloud.py",
    "scripts/cli/preview.py",
    "scripts/cli/settings_cmd.py",
    "scripts/techs.py",
    "tests/test_banner.py",
    "tests/test_living_art_render_state.py",
]

[tool.ty.overrides.rules]
unresolved-attribute = "warn"

[[tool.ty.overrides]]
include = [
    "scripts/art/ferrofluid.py",
    "scripts/art/genetic_landscape.py",
    "scripts/word_clouds/readability.py",
    "tests/test_art_color_science.py",
    "tests/test_cli.py",
    "tests/test_readme_sections.py",
    "tests/test_timelapse_runtime_contract.py",
    "tests/test_utils.py",
]

[tool.ty.overrides.rules]
invalid-argument-type = "warn"

[[tool.ty.overrides]]
include = [
    "scripts/art/lenia.py",
    "scripts/art/physarum.py",
    "scripts/art/topography.py",
]

[tool.ty.overrides.rules]
invalid-argument-type = "warn"
no-matching-overload = "warn"

[[tool.ty.overrides]]
include = ["scripts/art/optimize.py"]

[tool.ty.overrides.rules]
unknown-argument = "warn"

[[tool.ty.overrides]]
include = ["scripts/art/shared/world_state.py", "scripts/cli/auth.py"]

[tool.ty.overrides.rules]
no-matching-overload = "warn"

[[tool.ty.overrides]]
include = ["scripts/art/ink_garden.py"]

[tool.ty.overrides.rules]
invalid-argument-type = "warn"
no-matching-overload = "warn"
not-iterable = "warn"
not-subscriptable = "warn"
too-many-positional-arguments = "warn"
unresolved-attribute = "warn"
unsupported-operator = "warn"

[[tool.ty.overrides]]
include = ["scripts/utils.py"]

[tool.ty.overrides.rules]
invalid-argument-type = "warn"
invalid-assignment = "warn"
invalid-context-manager = "warn"
invalid-return-type = "warn"
no-matching-overload = "warn"
unknown-argument = "warn"

[[tool.ty.overrides]]
include = ["tests/test_ci_workflow.py"]

[tool.ty.overrides.rules]
invalid-argument-type = "warn"
no-matching-overload = "warn"
not-subscriptable = "warn"
unsupported-operator = "warn"

[[tool.ty.overrides]]
include = ["tests/test_ferrofluid.py"]

[tool.ty.overrides.rules]
invalid-argument-type = "warn"
unresolved-attribute = "warn"

[[tool.ty.overrides]]
include = ["tests/test_ink_garden.py"]

[tool.ty.overrides.rules]
invalid-argument-type = "warn"
invalid-assignment = "warn"

[[tool.ty.overrides]]
include = ["tests/test_physarum.py"]

[tool.ty.overrides.rules]
invalid-argument-type = "warn"
not-subscriptable = "warn"
unsupported-operator = "warn"
