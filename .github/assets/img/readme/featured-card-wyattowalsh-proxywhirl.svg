  --shadow-filter: url(#shadow);
  --glass-fill: url(#glass-grad);
  --rim-stroke: #ffffff;
  --rim-opacity: 0.12;
}
@media (prefers-color-scheme: dark) { :root {
  --card-bg: #0d1117;
