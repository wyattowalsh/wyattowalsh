<svg xmlns="http://www.w3.org/2000/svg" width="300" height="96" viewBox="0 0 300 96" role="img" aria-label="Cute views frame — peek-a-boo: you found the cookie jar" data-incrementer="komarev" data-username="wyattowalsh">
<defs>
<style>
:root {
  color-scheme: light dark;
  --vp-bubble: #ffffff;
  --vp-bubble-stroke: #d0d7de;
  --vp-text: #1f2328;
  --vp-kicker: #656d76;
  --vp-jar: #f5c84c;
  --vp-jar-deep: #d4a017;
  --vp-jar-stroke: #b45309;
  --vp-cookie: #c2410c;
  --vp-chip: #431407;
  --vp-lid: #f59e0b;
  --vp-peek: #6366f1;
  --vp-eye: #1f2328;
  --vp-sclera: #ffffff;
}
@media (prefers-color-scheme: dark) { :root {
  --vp-bubble: #0d1117;
  --vp-bubble-stroke: #30363d;
  --vp-text: #e6edf3;
  --vp-kicker: #8b949e;
  --vp-jar: #ca8a04;
  --vp-jar-deep: #854d0e;
  --vp-jar-stroke: #fbbf24;
  --vp-cookie: #fdba74;
  --vp-chip: #7c2d12;
  --vp-lid: #eab308;
  --vp-peek: #818cf8;
  --vp-eye: #0d1117;
  --vp-sclera: #f0f6fc;
}}
.vp-bubble { fill: var(--vp-bubble); stroke: var(--vp-bubble-stroke);
 stroke-width: 1.4; filter: url(#vp-shadow); }
.vp-tail { fill: var(--vp-bubble); stroke: var(--vp-bubble-stroke);
 stroke-width: 1.2; }
.vp-copy { fill: var(--vp-text); font: 700 13px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; }
.vp-kicker { fill: var(--vp-kicker); font: 700 9px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif;
 letter-spacing: 0.12em; text-transform: uppercase; }
.vp-jar-body { fill: var(--vp-jar); stroke: var(--vp-jar-stroke);
 stroke-width: 1.5; }
.vp-jar-deep { fill: var(--vp-jar-deep); opacity: 0.35; }
.vp-lid { fill: var(--vp-lid); stroke: var(--vp-jar-stroke);
 stroke-width: 1.4; }
.vp-cookie { fill: var(--vp-cookie); }
.vp-chip { fill: var(--vp-chip); }
.vp-peek { fill: var(--vp-peek); }
.vp-sclera { fill: var(--vp-sclera); }
.vp-pupil { fill: var(--vp-eye); }
.vp-smile { fill: none; stroke: var(--vp-eye); stroke-width: 1.3;
 stroke-linecap: round; }
</style>
<filter id="vp-shadow" x="-8%" y="-10%" width="120%" height="130%">
<feDropShadow dx="0" dy="2" stdDeviation="2.4" flood-color="#000000" flood-opacity="0.12"/>
</filter>
</defs>
