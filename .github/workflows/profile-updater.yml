          path: ${{ runner.temp }}/waka-readme

      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          enable-cache: false

      - name: Install dependencies
        run: uv sync --locked --all-extras

      - name: Publish and validate exact profile asset inventory
        run: |
          uv run python - <<'PY'
          import os
          import shutil
          import stat
          import tempfile
          from pathlib import Path
          from xml.etree import ElementTree as ET

          from PIL import Image

          expected_names = {
              "banner-dark.svg",
              "banner.svg",
              "qr.png",
              "wordcloud_typographic_by_languages.svg",
              "wordcloud_typographic_by_topics.svg",
          }
          stage_dir = Path(os.environ["RUNNER_TEMP"]) / "profile-assets"
          output_dir = Path(".github/assets/img")

          def validate(directory: Path, *, exact_directory: bool) -> None:
              if exact_directory:
                  observed = {path.name for path in directory.iterdir()}
              else:
                  observed = {
                      path.name
                      for pattern in ("banner*.svg", "qr*.png", "wordcloud_*.svg")
                      for path in directory.glob(pattern)
                  }
              if observed != expected_names:
                  raise SystemExit(
                      "Profile asset inventory mismatch: "
                      f"missing={sorted(expected_names - observed)}, "
                      f"unexpected={sorted(observed - expected_names)}"
                  )

              for name in sorted(expected_names):
                  path = directory / name
                  metadata = path.lstat()
                  if not stat.S_ISREG(metadata.st_mode) or metadata.st_size == 0:
                      raise SystemExit(
                          f"Profile asset is not a non-empty regular file: {path}"
                      )
                  if path.suffix == ".svg":
                      root = ET.parse(path).getroot()
                      if root.tag.rsplit("}", 1)[-1] != "svg":
                          raise SystemExit(
                              f"Profile asset is not an SVG document: {path}"
                          )
                  else:
                      with Image.open(path) as image:
                          image.verify()
                          if image.format != "PNG":
                              raise SystemExit(
                                  f"Profile asset is not a PNG image: {path}"
                              )

          validate(stage_dir, exact_directory=True)
          output_dir.mkdir(parents=True, exist_ok=True)

          managed_outputs = {
              path
              for pattern in ("banner*.svg", "qr*.png", "wordcloud_*.svg")
              for path in output_dir.glob(pattern)
          }
          for path in sorted(managed_outputs):
              metadata = path.lstat()
              if not stat.S_ISREG(metadata.st_mode):
                  raise SystemExit(
                      f"Managed profile-asset destination is not a regular file: {path}"
                  )
              if path.name not in expected_names:
                  path.unlink()

          for name in sorted(expected_names):
              source = stage_dir / name
              file_descriptor, temporary_name = tempfile.mkstemp(
                  dir=output_dir,
                  prefix=f".{name}.",
                  suffix=".tmp",
              )
              os.close(file_descriptor)
              temporary_path = Path(temporary_name)
              try:
                  shutil.copyfile(source, temporary_path)
                  os.chmod(temporary_path, source.stat().st_mode & 0o777)
                  os.replace(temporary_path, output_dir / name)
              finally:
                  temporary_path.unlink(missing_ok=True)

          validate(output_dir, exact_directory=False)
          print("Profile asset publication validation passed: 5 exact files")
          PY

      - name: Publish and validate living-art artifact
        run: |
          uv run python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          from scripts.art.artifacts import (
              LIVING_ART_BYTE_BUDGETS,
              publish_living_art_fleet,
              validate_living_art_byte_budgets,
          )

          stage_dir = Path(os.environ["RUNNER_TEMP"]) / "living-art-stage"
          output_dir = Path(".github/assets/img")
          public_dir = Path("docs/public/showcase")
          manifest_path, gallery_path, manifest = publish_living_art_fleet(
              stage_dir,
              output_dir,
              public_surface_dir=public_dir,
          )

          primary_manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          public_manifest = json.loads(
              (public_dir / manifest_path.name).read_text(encoding="utf-8")
          )
          if primary_manifest != manifest:
              raise SystemExit(
                  "Persisted primary living-art manifest differs from generated object"
              )

          def stable_payload(payload: dict[str, object]) -> dict[str, object]:
              return {
                  key: value
                  for key, value in payload.items()
                  if key not in {"generated_at", "output_dir"}
              }

          if stable_payload(primary_manifest) != stable_payload(public_manifest):
              raise SystemExit(
                  "Persisted primary/public living-art manifest payloads differ"
              )
          if gallery_path.read_bytes() != (
              public_dir / gallery_path.name
          ).read_bytes():
              raise SystemExit("Persisted primary/public living-art galleries differ")

          validate_living_art_byte_budgets(primary_manifest)
          validate_living_art_byte_budgets(public_manifest)
          for name in sorted(LIVING_ART_BYTE_BUDGETS):
              primary_hash = hashlib.sha256((output_dir / name).read_bytes()).digest()
              public_hash = hashlib.sha256((public_dir / name).read_bytes()).digest()
              if primary_hash != public_hash:
                  raise SystemExit(f"Persisted living-art GIF hashes differ: {name}")

          print(
              "Living-art publication validation passed: "
              f"{manifest['total_assets']} assets, "
              f"{manifest['total_bytes']} bytes"
          )
          PY

      - name: Apply WakaTime README section
        run: |
          set -euo pipefail
          uv run python -m scripts.wakatime_readme apply \
            --artifact "${{ runner.temp }}/waka-readme/waka-section.md" \
            --readme README.md

      - name: Generate README Sections
        run: uv run python -m scripts.cli generate readme-sections --config-path config.yaml

      - name: Generate Skills Badges
        run: uv run python -m scripts.cli generate skills --skills-path skills.yaml

      - name: Commit and push owned profile artifacts
        env:
          TRIGGER_REF_TYPE: ${{ github.ref_type }}
          TRIGGER_SHA: ${{ github.sha }}
          TARGET_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          commit_group() {
            local message="$1"
            shift
            local owned_files=("$@")
            if [ "${#owned_files[@]}" -eq 0 ]; then
              echo "Skipping empty group for: ${message}"
              return 0
            fi
            if [ -z "$(git status --porcelain --untracked-files=all -- "${owned_files[@]}")" ]; then
              echo "No changes for: ${message}"
              return 0
            fi
            git add -A -- "${owned_files[@]}"
            git commit -m "${message}"
          }

          commit_group "chore(data): update awesome-stars lists (languages.md, topics.md)" \
            ./.github/assets/languages.md \
            ./.github/assets/topics.md

          asset_files=(
            ':(glob).github/assets/img/qr*.png'
            ':(glob).github/assets/img/wordcloud_*.svg'
            ':(glob).github/assets/img/banner*.svg'
          )
          commit_group "chore(assets): update generated profile assets" "${asset_files[@]}"

          art_files=(
            ':(glob).github/assets/img/living-*.gif'
            .github/assets/img/living-art-manifest.json
            .github/assets/img/living-art-preview.html
            ':(glob)docs/public/showcase/living-*.gif'
            docs/public/showcase/living-art-manifest.json
            docs/public/showcase/living-art-preview.html
          )
          commit_group "art: regenerate living-art assets" "${art_files[@]}"

          metrics_files=(
            ./.github/assets/img/metrics.svg
            ./.github/assets/img/metrics.additional.svg
            ./.github/assets/img/metrics.extra.svg
            ./.github/assets/img/metrics-habits.svg
            ./.github/assets/img/metrics-activity.svg
            ./.github/assets/img/metrics-music.svg
            ./.github/assets/img/metrics-posts.svg
          )
          # Only add paths that exist or are tracked.
          metrics_existing=()
          for file in "${metrics_files[@]}"; do
            if [ -e "$file" ] || git ls-files --error-unmatch "$file" >/dev/null 2>&1; then
              metrics_existing+=("$file")
            fi
          done
          if [ "${#metrics_existing[@]}" -gt 0 ]; then
            if [ -n "$(git status --porcelain --untracked-files=all -- "${metrics_existing[@]}")" ]; then
              git add -A -- "${metrics_existing[@]}"
              git commit -m "chore(metrics): update generated metrics assets"
            else
              echo "No changes for: chore(metrics): update generated metrics assets"
            fi
          fi

          readme_files=(
            README.md
            ':(glob).github/assets/img/readme/*.svg'
          )
          commit_group "chore(readme): update dynamic sections and skills badges" "${readme_files[@]}"

          # BEGIN trigger-consistent-push
          if [ "${TRIGGER_REF_TYPE}" != "branch" ]; then
            echo "::error::Profile publication requires a branch trigger."
            exit 1
          fi

          trigger_is_current() {
            if ! git fetch --no-tags origin \
              "+refs/heads/${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}"; then
              echo "::error::Failed to refresh ${TARGET_BRANCH} before profile publication."
              return 2
            fi
            remote_target="$(git rev-parse "refs/remotes/origin/${TARGET_BRANCH}")"
            [ "${remote_target}" = "${TRIGGER_SHA}" ]
          }

          if trigger_is_current; then
            :
          elif [ "$?" -eq 1 ]; then
            echo "::notice::Skipping profile publication because ${TARGET_BRANCH} advanced beyond this run's trigger revision."
            exit 0
          else
            exit 1
          fi

          ahead="$(git rev-list --count "refs/remotes/origin/${TARGET_BRANCH}..HEAD")"
          if [ "${ahead}" = "0" ]; then
            echo "No finalize commits to push."
            exit 0
          fi
          if ! git merge-base --is-ancestor "${TRIGGER_SHA}" HEAD; then
            echo "::error::Finalize commits are not based on the immutable trigger revision."
            exit 1
          fi

          for attempt in 1 2 3; do
            if git push \
              --force-with-lease="refs/heads/${TARGET_BRANCH}:${TRIGGER_SHA}" \
              origin "HEAD:refs/heads/${TARGET_BRANCH}"; then
              exit 0
            fi

            if [ "$attempt" -eq 3 ]; then
              echo "::error::Failed to push finalize commits after ${attempt} attempts."
              exit 1
            fi

            if trigger_is_current; then
              :
            elif [ "$?" -eq 1 ]; then
              echo "::notice::Skipping profile publication because ${TARGET_BRANCH} advanced during push retries."
              exit 0
            else
              exit 1
            fi
          done
          # END trigger-consistent-push
