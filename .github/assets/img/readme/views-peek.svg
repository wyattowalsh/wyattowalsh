<svg xmlns="http://www.w3.org/2000/svg" width="360" height="72" viewBox="0 0 360 72" role="img" aria-label="You found the cookie jar. These are peek-a-boos.">
<style>
:root { color-scheme: light dark; }
.jar { fill: #fff7ed; stroke: #c2410c; stroke-width: 1.6; }
.lid { fill: #fdba74; stroke: #c2410c; stroke-width: 1.4; }
.chip { fill: #9a3412; }
.bubble { fill: #fff7ed; stroke: #c2410c; stroke-width: 1.5; }
.copy { fill: #9a3412; font-family: ui-rounded, ui-sans-serif, system-ui, sans-serif; font-weight: 700; }
.eye { fill: #111827; }
.blush { fill: #fb7185; opacity: 0.7; }
@media (prefers-color-scheme: dark) {
  .jar { fill: #431407; stroke: #fdba74; }
  .lid { fill: #7c2d12; stroke: #fdba74; }
  .chip { fill: #fdba74; }
  .bubble { fill: #431407; stroke: #fdba74; }
  .copy { fill: #fed7aa; }
  .eye { fill: #fed7aa; }
  .blush { fill: #fb7185; }
}
</style>
<rect class="bubble" x="88" y="8" width="260" height="56" rx="16"/>
<path class="bubble" d="M88 36 L70 44 L88 48 Z"/>
<ellipse class="jar" cx="40" cy="42" rx="22" ry="20"/>
<rect class="lid" x="20" y="16" width="40" height="10" rx="4"/>
<circle class="chip" cx="32" cy="40" r="2.2"/>
<circle class="chip" cx="46" cy="46" r="2"/>
<circle class="chip" cx="38" cy="50" r="1.6"/>
<circle class="eye" cx="32" cy="18" r="2.4"/>
<circle class="eye" cx="48" cy="18" r="2.4"/>
<ellipse class="blush" cx="26" cy="24" rx="3.2" ry="1.6"/>
<ellipse class="blush" cx="54" cy="24" rx="3.2" ry="1.6"/>
<text class="copy" x="104" y="32" font-size="13">you found the cookie jar</text>
<text class="copy" x="104" y="52" font-size="11" font-weight="600">these numbers are peek-a-boos</text>
</svg>
