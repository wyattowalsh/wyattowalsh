<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="480" height="150" viewBox="0 0 480 150" role="img" aria-label="Shipping syrupy SVG snapshots">
<defs><style>
:root {
  --card-bg: #ffffff;
  --card-border: #d0d7de;
  --title-color: #0969da;
  --text-color: #656d76;
  --meta-color: #656d76;
  --accent: #0969da;
  --shadow-filter: url(#shadow);
  --glass-fill: url(#glass-grad);
  --rim-stroke: #ffffff;
  --rim-opacity: 0.12;
}
@media (prefers-color-scheme: dark) { :root {
  --card-bg: #0d1117;
  --card-border: #30363d;
  --title-color: #58a6ff;
  --text-color: #8b949e;
  --meta-color: #8b949e;
  --accent: #58a6ff;
  --shadow-filter: url(#shadow-dark);
  --glass-fill: url(#glass-grad-dark);
  --rim-stroke: #f0f6fc;
  --rim-opacity: 0.08;
}}
.rc-bg { fill: var(--card-bg); filter: var(--shadow-filter); }
.rc-border { stroke: var(--card-border); }
.rc-glass { fill: var(--glass-fill); }
.rc-rim { fill: none; stroke: var(--rim-stroke); stroke-opacity: var(--rim-opacity); stroke-width: 1; }
.blog-title { fill: var(--title-color); font: 600 16px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; }
.blog-desc { fill: var(--text-color); font: 400 13px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; }
.blog-meta { fill: var(--meta-color); font: 400 12px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; }
</style>
<clipPath id="bar-clip"><rect width="480" height="150" rx="10"/></clipPath><filter id="shadow" x="-5%" y="-5%" width="110%" height="110%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.08"/><feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#000000" flood-opacity="0.05"/></filter><filter id="shadow-dark" x="-5%" y="-5%" width="110%" height="110%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#010409" flood-opacity="0.55"/><feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#010409" flood-opacity="0.35"/></filter><linearGradient id="glass-grad" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#ffffff" stop-opacity="0.05" /><stop offset="100%" stop-color="#ffffff" stop-opacity="0" /></linearGradient><linearGradient id="glass-grad-dark" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#f0f6fc" stop-opacity="0.06" /><stop offset="100%" stop-color="#f0f6fc" stop-opacity="0" /></linearGradient><linearGradient id="footer-div-grad" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="var(--accent)" stop-opacity="0.5" /><stop offset="100%" stop-color="var(--accent)" stop-opacity="0" /></linearGradient>
</defs>
<rect class="rc-bg" width="480" height="150" rx="10" />
<rect class="rc-glass" width="480" height="150" rx="10" />
<rect class="rc-border" x="0.5" y="0.5" width="479" height="149" rx="10" fill="none" stroke-width="1" />
<rect class="rc-rim" x="1.5" y="1.5" width="477" height="147" rx="9" />
<rect x="0" y="0" width="480" height="3" fill="var(--accent)" clip-path="url(#bar-clip)" />
<text class="blog-title" x="20" y="34">Shipping syrupy SVG snapshots</text>
<text class="blog-desc" x="20" y="62">Deterministic visual regression for README cards.</text>
<rect x="20" y="120" width="80" height="1.5" rx="0.5" fill="url(#footer-div-grad)" />
<text class="blog-meta" x="20" y="136">2026-07-31 · w4w.dev</text>
</svg>