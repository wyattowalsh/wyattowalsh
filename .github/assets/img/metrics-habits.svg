<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="312" viewBox="0 0 1200 312" role="img" aria-label="Coding habits">
<defs>
<style>
:root {
  --canvas-bg: #ffffff;
  --card-bg: #ffffff;
  --panel-bg: #f6f8fa;
  --card-border: #d0d7de;
  --title-color: #1f2328;
  --text-color: #656d76;
  --meta-color: #656d76;
  --accent: #8250df;
  --focus: #8250df;
  --peak: #1a7f37;
  --streak: #bf4b8a;
}
@media (prefers-color-scheme: dark) { :root {
  --canvas-bg: #0d1117;
  --card-bg: #0d1117;
  --panel-bg: #161b22;
  --card-border: #30363d;
  --title-color: #e6edf3;
  --text-color: #8b949e;
  --meta-color: #8b949e;
  --accent: #a371f7;
  --focus: #a371f7;
  --peak: #3fb950;
  --streak: #db61a2;
}}
.title { fill: var(--title-color); font: 700 22px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; }
.kicker { fill: var(--meta-color); font: 700 11px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif;
 letter-spacing: 0.08em; text-transform: uppercase; }
.label { fill: var(--meta-color); font: 700 11px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif;
 letter-spacing: 0.08em; text-transform: uppercase; }
.value { fill: var(--title-color); font: 700 28px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; }
.body { fill: var(--title-color); font: 600 14px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; }
.muted { fill: var(--text-color); font: 400 12px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; }
.meta { fill: var(--meta-color); font: 400 12px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; }
.hero-title { fill: var(--title-color); font: 700 28px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; }
.hero-artist { fill: var(--title-color); font: 600 16px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; }
.extra-title { fill: var(--title-color); font: 600 13px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; }
.panel { fill: var(--panel-bg); }
.panel-stroke { fill: none; stroke: var(--card-border); }
.card-bg { fill: var(--card-bg); }
.card-stroke { fill: none; stroke: var(--card-border); }
.focus-bar { fill: var(--focus); }
.peak-tick { fill: var(--card-border); }
.peak-tick-on { fill: var(--peak); fill-opacity: 0.55; }
.peak-tick-max { fill: var(--peak); }
.streak-fill { fill: var(--streak); }
.streak-empty { fill: var(--card-border); }
.cadence { fill: var(--streak); }
</style>
</defs>
<rect class="card-bg" width="1200" height="312" rx="12" />
<rect class="card-stroke" x="0.5" y="0.5" width="1199" height="311" rx="12" stroke-width="1" />
<rect width="1200" height="3" fill="var(--accent)" />
<text class="title" x="28" y="40">Coding habits</text>
<text class="kicker" x="1172" y="38" text-anchor="end">Focus · Peak hour · Streaks</text>
<g class="habits-focus" transform="translate(20,58)">
