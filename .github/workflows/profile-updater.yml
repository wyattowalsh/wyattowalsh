name: Unified Profile Updater

on:
  workflow_dispatch:
    inputs:
      metrics_probe_mode:
        description: "Run only the manual full-metrics probe lane"
        type: boolean
        required: false
        default: false
  schedule:
    - cron: "0 1 * * *" # Run once a day at 1 AM UTC
  push:
    branches:
      - master
      - main
      - dev

concurrency:
  group: profile-updater-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  probe-full-metrics:
    name: Probe Full Metrics Surface
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.metrics_probe_mode == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          enable-cache: false

      - name: Install metrics helper dependencies
        run: uv sync --locked

      - name: Probe metrics credentials and upstream availability
        id: metrics_auth
        env:
          METRICS_TOKEN: ${{ secrets.METRICS_TOKEN }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_KEY_SECRET: ${{ secrets.X_API_KEY_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
        run: |
          set -euo pipefail

          has_valid_metrics_token=false
          if [ -n "${METRICS_TOKEN:-}" ]; then
            metrics_status=$(curl --silent --output /dev/null --write-out '%{http_code}' \
              --connect-timeout 5 \
              --max-time 15 \
              -H "Authorization: Bearer ${METRICS_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              https://api.github.com/user || true)
            [ "${metrics_status}" = "200" ] && has_valid_metrics_token=true
          fi
          echo "has_valid_metrics_token=${has_valid_metrics_token}" >> "$GITHUB_OUTPUT"

          x_oauth1_status="missing"
          if [ -n "${X_API_KEY:-}" ] && [ -n "${X_API_KEY_SECRET:-}" ] && [ -n "${X_ACCESS_TOKEN:-}" ] && [ -n "${X_ACCESS_TOKEN_SECRET:-}" ]; then
            x_oauth1_status="present"
          fi

          {
            echo "### Metrics probe auth summary"
            echo
            echo "- Valid METRICS_TOKEN: ${has_valid_metrics_token}"
            echo "- X OAuth1 credentials: ${x_oauth1_status}"
            echo "- Spotify on lowlighter: never (plugin_music=no; supplemental owns music)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Probe full personal metrics
        id: probe_primary
        continue-on-error: true
        uses: lowlighter/metrics@65836723097537a54cd8eb90f61839426b4266b6 # v3.34
        with:
          output_action: none
          filename: .github/assets/img/metrics.probe.primary.svg
          token: ${{ steps.metrics_auth.outputs.has_valid_metrics_token == 'true' && secrets.METRICS_TOKEN || github.token }}
          base: header, activity, community, metadata
          plugin_lines: no
          plugin_isocalendar: yes
          plugin_traffic: ${{ steps.metrics_auth.outputs.has_valid_metrics_token == 'true' && 'yes' || 'no' }}
          plugin_languages: yes
          plugin_languages_ignored: "jupyter%20notebook"
          plugin_languages_details: "bytes-size, percentage"
          plugin_languages_threshold: "2%"
          # Probe-only diagnostics for upstream habits degradation; production keeps this off.
          plugin_habits: yes
          plugin_habits_from: 1000
          plugin_habits_days: 30
          plugin_habits_facts: yes
          plugin_habits_charts: yes
          plugin_habits_charts_type: classic
          plugin_habits_languages_limit: 8
          plugin_habits_languages_threshold: "0%"
          plugin_notable: yes
          plugin_notable_repositories: ${{ steps.metrics_auth.outputs.has_valid_metrics_token == 'true' && 'yes' || 'no' }}
          plugin_gists: no
          plugin_topics: yes
          plugin_topics_sort: stars
          plugin_topics_limit: 15
          plugin_music: no
          # Disabled: upstream still queries retired Projects (classic) fields
          # and embeds an error payload for this account.
          plugin_achievements: no
          plugin_calendar: yes
          plugin_calendar_limit: 1
          plugin_people: yes
          plugin_people_limit: 12
          plugin_people_types: followers, following
          config_timezone: America/Los_Angeles
          config_padding: 10%

      - name: Collect full personal metrics output
        if: ${{ always() }}
        continue-on-error: true
        run: |
          set -euo pipefail
          cp /metrics_renders/.github/assets/img/metrics.probe.primary.svg ./.github/assets/img/metrics.probe.primary.svg

      - name: Probe full additional metrics
        id: probe_additional
        continue-on-error: true
        uses: lowlighter/metrics@65836723097537a54cd8eb90f61839426b4266b6 # v3.34
        with:
          output_action: none
          filename: .github/assets/img/metrics.probe.additional.svg
          token: ${{ steps.metrics_auth.outputs.has_valid_metrics_token == 'true' && secrets.METRICS_TOKEN || github.token }}
          base: ""
          config_timezone: America/Los_Angeles
          config_padding: 10%
          plugin_music: no
          # Probe-only diagnostics for upstream activity degradation; production keeps this off.
          plugin_activity: yes
          plugin_activity_limit: 5
          plugin_activity_days: 14
          plugin_activity_filter: all
          plugin_stargazers: ${{ steps.metrics_auth.outputs.has_valid_metrics_token == 'true' && 'yes' || 'no' }}
          plugin_stargazers_charts: yes
          plugin_stars: ${{ steps.metrics_auth.outputs.has_valid_metrics_token == 'true' && 'yes' || 'no' }}
          plugin_stars_limit: ${{ steps.metrics_auth.outputs.has_valid_metrics_token == 'true' && '3' || '0' }}
          plugin_repositories: yes
          plugin_repositories_featured: "wyattowalsh/agents, wyattowalsh/nbadb, wyattowalsh/proxywhirl, wyattowalsh/mcp-crawl4ai, wyattowalsh/fl-mcp, wyattowalsh/listentropy, wyattowalsh/personal-website, wyattowalsh/mdxpad, wyattowalsh/ai-web-feeds, wyattowalsh/iina-plugin-bookmarks"
          plugin_tweets: no

      - name: Collect full additional metrics output
        if: ${{ always() }}
        continue-on-error: true
        run: |
          set -euo pipefail
          cp /metrics_renders/.github/assets/img/metrics.probe.additional.svg ./.github/assets/img/metrics.probe.additional.svg

      - name: Probe full extra metrics
        id: probe_extra
        continue-on-error: true
        uses: lowlighter/metrics@65836723097537a54cd8eb90f61839426b4266b6 # v3.34
        with:
          output_action: none
          filename: .github/assets/img/metrics.probe.extra.svg
          token: ${{ steps.metrics_auth.outputs.has_valid_metrics_token == 'true' && secrets.METRICS_TOKEN || github.token }}
          base: ""
          config_timezone: America/Los_Angeles
          config_padding: 10%
          plugin_music: no
          plugin_reactions: yes
          plugin_reactions_limit: 100
          plugin_reactions_display: relative
          plugin_followup: yes
          plugin_followup_sections: repositories

      - name: Collect full extra metrics output
        if: ${{ always() }}
        continue-on-error: true
        run: |
          set -euo pipefail
          cp /metrics_renders/.github/assets/img/metrics.probe.extra.svg ./.github/assets/img/metrics.probe.extra.svg

      - name: Validate probe outputs
        id: validate_probe_outputs
        if: ${{ always() }}
        continue-on-error: true
        run: |
          set -euo pipefail
          uv run python -m scripts.metrics_svg validate ./.github/assets/img/metrics.probe.primary.svg
          uv run python -m scripts.metrics_svg validate ./.github/assets/img/metrics.probe.additional.svg
          uv run python -m scripts.metrics_svg validate ./.github/assets/img/metrics.probe.extra.svg

      - name: Summarize probe output markers
        if: ${{ always() }}
        run: |
          set -euo pipefail

          summarize_markers() {
            local asset_path="$1"
            shift
            local asset_name
            asset_name=$(basename "$asset_path")

            {
              echo "#### ${asset_name}"
              if [ ! -f "$asset_path" ]; then
                echo "- missing"
                echo
                return
              fi
              for marker in "$@"; do
                if grep -Fq "$marker" "$asset_path"; then
                  echo "- ${marker}: present"
                else
                  echo "- ${marker}: absent"
                fi
              done
              echo
            } >> "$GITHUB_STEP_SUMMARY"
          }

          {
            echo "### Full metrics probe markers"
            echo
          } >> "$GITHUB_STEP_SUMMARY"

          summarize_markers ./.github/assets/img/metrics.probe.primary.svg \
            "Recent coding habits" \
            "Commit calendar" \
            "Followers" \
            "Insufficient token scopes" \
            "Unexpected error"

          summarize_markers ./.github/assets/img/metrics.probe.additional.svg \
            "Recent activity" \
            "Featured repositories" \
            "Recently starred repositories" \
            "Stargazers" \
            "Unexpected error"

          summarize_markers ./.github/assets/img/metrics.probe.extra.svg \
            "Reactions" \
            "Follow-up" \
            "Unexpected error"

      - name: Upload full metrics probe artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: metrics-probe-${{ github.run_id }}
          path: |
            .github/assets/img/metrics.probe.primary.svg
            .github/assets/img/metrics.probe.additional.svg
            .github/assets/img/metrics.probe.extra.svg
          if-no-files-found: warn
          retention-days: 7
          overwrite: true

      - name: Enforce probe success
        if: ${{ always() }}
        run: |
          set -euo pipefail
          [ "${{ steps.probe_primary.outcome }}" = "success" ]
          [ "${{ steps.probe_additional.outcome }}" = "success" ]
          [ "${{ steps.probe_extra.outcome }}" = "success" ]
          [ "${{ steps.validate_probe_outputs.outcome }}" = "success" ]

  update-starred-lists:
    name: Update Starred Repository Lists (MD Files)
    if: >-
      ${{
        github.event.inputs.metrics_probe_mode != 'true' &&
        (
          github.event_name != 'push' ||
          (
            github.event.head_commit.message != 'Updated with Dev Metrics' &&
            github.event.head_commit.message != 'chore(metrics): update generated metrics assets' &&
            github.event.head_commit.message != 'chore(data): update awesome-stars lists (languages.md, topics.md)' &&
            github.event.head_commit.message != 'chore(assets): update generated profile assets' &&
            github.event.head_commit.message != 'art: regenerate living-art assets' &&
            github.event.head_commit.message != 'chore(readme): update dynamic sections and skills badges'
          )
        )
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 30  # Full starred-repository pagination can exceed 15m.
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          enable-cache: false

      - name: Install first-party list generator dependencies
        run: uv sync --locked

      - name: Generate starred-repository language and topic lists
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          uv run python -m scripts.starred_lists \
            --owner "$USERNAME" \
            --languages-output .github/assets/languages.md \
            --topics-output .github/assets/topics.md \
            --topic-threshold 500

      - name: Validate starred-list consumer contract
        run: |
          set -euo pipefail
          uv run python - <<'PY'
          from pathlib import Path

          for filename in ("languages.md", "topics.md"):
              path = Path(".github/assets") / filename
              text = path.read_text(encoding="utf-8")
              lines = text.splitlines()
              if not text.strip() or any(line.startswith("Error:") for line in lines):
                  raise SystemExit(f"{path} contains an error or is empty")
              if "## Contents" not in lines:
                  raise SystemExit(f"{path} is missing the contents heading")
              if not any(line.startswith("- [") and "](https://github.com/") in line for line in lines):
                  raise SystemExit(f"{path} contains no GitHub repository entries")
          PY

      - name: Upload starred lists artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: starred-lists-${{ github.run_id }}
          path: |
            .github/assets/languages.md
            .github/assets/topics.md
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  generate-assets:
    name: Generate Profile Assets (QR, WordClouds, Banner)
    runs-on: ubuntu-latest
    needs: update-starred-lists # Depends on the md files being up-to-date
    if: >-
      ${{
        github.event.inputs.metrics_probe_mode != 'true' &&
        !cancelled() &&
        needs.update-starred-lists.result == 'success' &&
        (
          github.event_name != 'push' ||
          (
            github.event.head_commit.message != 'Updated with Dev Metrics' &&
            github.event.head_commit.message != 'chore(metrics): update generated metrics assets' &&
            github.event.head_commit.message != 'chore(data): update awesome-stars lists (languages.md, topics.md)' &&
            github.event.head_commit.message != 'chore(assets): update generated profile assets' &&
            github.event.head_commit.message != 'art: regenerate living-art assets' &&
            github.event.head_commit.message != 'chore(readme): update dynamic sections and skills badges'
          )
        )
      }}
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Download starred lists artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        env:
          # Remove after actions/download-artifact#484 is fixed in a reviewed pin.
          NODE_OPTIONS: --disable-warning=DEP0005
        with:
          name: starred-lists-${{ github.run_id }}
          path: .github/assets

      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          enable-cache: false

      - name: Install Cairo system dependencies
        run: sudo apt-get update && sudo apt-get install -y libcairo2 libcairo2-dev pkg-config libffi-dev

      - name: Install asset generation dependencies
        run: uv sync --locked --extra qr --extra word-clouds

      - name: Install SVG optimizer
        run: npm install --global --no-audit --no-fund svgo@4.0.2

      - name: Generate QR Code
        run: uv run python -m scripts.cli generate qr --config-path config.yaml

      - name: Generate Word Cloud by Topic
        run: |
          uv run python -m scripts.cli generate word-cloud \
            --config-path config.yaml \
            --from-topics-md \
            --output-path .github/assets/img/wordcloud_typographic_by_topics.svg

      - name: Generate Word Cloud by Language
        run: |
          uv run python -m scripts.cli generate word-cloud \
            --config-path config.yaml \
            --from-languages-md \
            --output-path .github/assets/img/wordcloud_typographic_by_languages.svg

      - name: Generate light and dark banners
        run: uv run python -m scripts.cli generate banner --config-path config.yaml

      - name: Validate exact profile asset inventory
        run: |
          uv run python - <<'PY'
          import stat
          from pathlib import Path
          from xml.etree import ElementTree as ET

          from PIL import Image

          asset_dir = Path(".github/assets/img")
          expected = {
              asset_dir / "banner-dark.svg",
              asset_dir / "banner.svg",
              asset_dir / "qr.png",
              asset_dir / "wordcloud_typographic_by_languages.svg",
              asset_dir / "wordcloud_typographic_by_topics.svg",
          }
          observed = {
              *asset_dir.glob("banner*.svg"),
              *asset_dir.glob("qr*.png"),
              *asset_dir.glob("wordcloud_*.svg"),
          }
          if observed != expected:
              missing = sorted(str(path) for path in expected - observed)
              unexpected = sorted(str(path) for path in observed - expected)
              raise SystemExit(
                  "Profile asset inventory mismatch: "
                  f"missing={missing}, unexpected={unexpected}"
              )

          for path in sorted(expected):
              metadata = path.lstat()
              if not stat.S_ISREG(metadata.st_mode) or metadata.st_size == 0:
                  raise SystemExit(f"Profile asset is not a non-empty regular file: {path}")
              if path.suffix == ".svg":
                  root = ET.parse(path).getroot()
                  if root.tag.rsplit("}", 1)[-1] != "svg":
                      raise SystemExit(f"Profile asset is not an SVG document: {path}")
              else:
                  with Image.open(path) as image:
                      image.verify()
                      if image.format != "PNG":
                          raise SystemExit(f"Profile asset is not a PNG image: {path}")

          print("Profile asset validation passed: 5 exact files")
          PY

      - name: Upload profile assets artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: profile-assets-${{ github.run_id }}
          path: |
            .github/assets/img/banner-dark.svg
            .github/assets/img/banner.svg
            .github/assets/img/qr.png
            .github/assets/img/wordcloud_typographic_by_languages.svg
            .github/assets/img/wordcloud_typographic_by_topics.svg
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  update-readme-wakatime:
    # First-party Waka: generate artifact only. Finalize applies the
    # <!--START_SECTION:waka--> … <!--END_SECTION:waka--> zone (sole git writer).
    name: Generate WakaTime README Section
    runs-on: ubuntu-latest
    if: >-
      ${{
        github.event.inputs.metrics_probe_mode != 'true' &&
        (
          github.event_name != 'push' ||
          (
            github.event.head_commit.message != 'Updated with Dev Metrics' &&
            github.event.head_commit.message != 'chore(metrics): update generated metrics assets' &&
            github.event.head_commit.message != 'chore(data): update awesome-stars lists (languages.md, topics.md)' &&
            github.event.head_commit.message != 'chore(assets): update generated profile assets' &&
            github.event.head_commit.message != 'art: regenerate living-art assets' &&
            github.event.head_commit.message != 'chore(readme): update dynamic sections and skills badges'
          )
        )
      }}
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          enable-cache: false

      - name: Install dependencies
        run: uv sync --locked

      - name: Preflight WakaTime auth gate
        id: wakatime_auth
        env:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
        run: |
          set -euo pipefail
          has_wakatime_api_key=false
          [ -n "${WAKATIME_API_KEY:-}" ] && has_wakatime_api_key=true
          echo "has_wakatime_api_key=${has_wakatime_api_key}" >> "$GITHUB_OUTPUT"
          if [ "${has_wakatime_api_key}" != "true" ]; then
            echo "::notice::WAKATIME_API_KEY is missing; writing skip marker for finalize."
          fi

      - name: Generate WakaTime README section artifact
        env:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/waka-readme"
          uv run python -m scripts.cli generate wakatime \
            --output-dir "$RUNNER_TEMP/waka-readme" \
            --github-login "${{ github.repository_owner }}" \
            --allow-missing-key

      - name: Upload WakaTime README section artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: waka-readme-${{ github.run_id }}
          path: ${{ runner.temp }}/waka-readme
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  generate-profile-metrics:
    name: Generate Profile Metrics SVGs
    if: >-
      ${{
        github.event.inputs.metrics_probe_mode != 'true' &&
        (
          github.event_name != 'push' ||
          (
            github.event.head_commit.message != 'Updated with Dev Metrics' &&
            github.event.head_commit.message != 'chore(metrics): update generated metrics assets' &&
            github.event.head_commit.message != 'chore(data): update awesome-stars lists (languages.md, topics.md)' &&
            github.event.head_commit.message != 'chore(assets): update generated profile assets' &&
            github.event.head_commit.message != 'art: regenerate living-art assets' &&
            github.event.head_commit.message != 'chore(readme): update dynamic sections and skills badges'
          )
        )
      }}
    runs-on: ubuntu-latest
    # lowlighter personal + additional can exceed 20m under API load; keep headroom.
    timeout-minutes: 60  # lowlighter personal+additional+extra routinely exceeds 45m under load
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Install uv
        uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          enable-cache: false
      - name: Install metrics helper dependencies
        run: uv sync --locked
      - name: Preflight metrics auth gates
        id: metrics_auth
        env:
          METRICS_TOKEN: ${{ secrets.METRICS_TOKEN }}
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_KEY_SECRET: ${{ secrets.X_API_KEY_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
        run: |
          set -euo pipefail
          # Secret setup guidance (see .github/SECURITY.md):
          # - METRICS_TOKEN: prefer a fine-grained PAT (Metadata/Contents/Profile: Read;
          #   org membership Read only if needed). Classic fallback: read:user, public_repo
          #   (+ read:org). Never grant write/admin/workflow. Used only as lowlighter
          #   `token:` / first-party GraphQL reads — never as a catch-all PAT.
          # - Spotify / X secrets: first-party supplemental cards only (env: on the
          #   generate supplemental-metrics run step). Never pass them into
          #   lowlighter/metrics (or any metrics fork) `with:` inputs.
          has_valid_metrics_token=false
          if [ -n "${METRICS_TOKEN:-}" ]; then
            metrics_status=$(curl --silent --output /dev/null --write-out '%{http_code}' \
              --connect-timeout 5 \
              --max-time 15 \
              -H "Authorization: Bearer ${METRICS_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              https://api.github.com/user || true)
            [ "${metrics_status}" = "200" ] && has_valid_metrics_token=true
          fi
          has_spotify_tokens=false
          if [ -n "${SPOTIFY_CLIENT_ID:-}" ] && [ -n "${SPOTIFY_CLIENT_SECRET:-}" ] && [ -n "${SPOTIFY_REFRESH_TOKEN:-}" ]; then
            has_spotify_tokens=true
          fi
          has_x_oauth1_tokens=false
          if [ -n "${X_API_KEY:-}" ] && [ -n "${X_API_KEY_SECRET:-}" ] && [ -n "${X_ACCESS_TOKEN:-}" ] && [ -n "${X_ACCESS_TOKEN_SECRET:-}" ]; then
            has_x_oauth1_tokens=true
          fi
          echo "has_valid_metrics_token=${has_valid_metrics_token}" >> "$GITHUB_OUTPUT"
          if [ "${has_valid_metrics_token}" != "true" ]; then
            echo "::notice::METRICS_TOKEN is missing or invalid; repositories-sensitive lowlighter plugins are disabled."
          fi
          if [ "${has_spotify_tokens}" != "true" ]; then
            echo "::notice::Spotify secrets are incomplete; first-party metrics-music.svg supplemental card is disabled."
          fi
          if [ "${has_x_oauth1_tokens}" != "true" ]; then
            echo "::notice::X OAuth1 secrets are incomplete; first-party metrics-posts.svg supplemental card is disabled."
          fi
      - name: Back up existing metrics assets
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/metrics-backups"

          backup_metric() {
            local source_path="$1"
            local backup_path="$2"

            if [ -f "$source_path" ]; then
              cp "$source_path" "$backup_path"
              echo "::notice::Backed up $(basename "$source_path") to ${backup_path}."
            else
              rm -f "$backup_path"
              echo "::notice::No existing $(basename "$source_path") asset found to back up."
            fi
          }

          backup_metric ./.github/assets/img/metrics.svg "$RUNNER_TEMP/metrics-backups/metrics.svg"
          backup_metric ./.github/assets/img/metrics.additional.svg "$RUNNER_TEMP/metrics-backups/metrics.additional.svg"
          backup_metric ./.github/assets/img/metrics.extra.svg "$RUNNER_TEMP/metrics-backups/metrics.extra.svg"
          rm -f ./.github/assets/img/metrics.svg ./.github/assets/img/metrics.additional.svg ./.github/assets/img/metrics.extra.svg
      # Third-party lowlighter only: read-scoped METRICS_TOKEN (or github.token).
      # No Spotify / X / write PATs in `with:` — plugin_music stays no.
      - name: Personal metrics
        id: lowlighter_metrics_primary
        continue-on-error: true
        uses: lowlighter/metrics@65836723097537a54cd8eb90f61839426b4266b6 # v3.34
        with:
          output_action: none
          filename: .github/assets/img/metrics.svg
          token: ${{ steps.metrics_auth.outputs.has_valid_metrics_token == 'true' && secrets.METRICS_TOKEN || github.token }}
          base: header, activity, community, metadata
          # Disabled until upstream handles bot/system authors without throwing.
          plugin_lines: no
          plugin_isocalendar: yes
          plugin_traffic: ${{ steps.metrics_auth.outputs.has_valid_metrics_token == 'true' && 'yes' || 'no' }}
          plugin_languages: yes
          plugin_languages_ignored: "jupyter%20notebook"
          plugin_languages_details: "bytes-size, percentage"
          plugin_languages_threshold: "2%"
          # The habits panel still emits inline errors in upstream renders; use
          # the repo-owned supplemental card instead.
          plugin_habits: no
          plugin_habits_from: 1000
          plugin_habits_days: 30
          plugin_habits_facts: yes
          plugin_habits_charts: yes
          plugin_habits_charts_type: classic
          plugin_habits_languages_limit: 8
          plugin_habits_languages_threshold: "0%"
          plugin_notable: yes
          plugin_notable_repositories: ${{ steps.metrics_auth.outputs.has_valid_metrics_token == 'true' && 'yes' || 'no' }}
          # GitHub Actions tokens cannot read gists reliably for this account.
          plugin_gists: no
          plugin_topics: yes
          plugin_topics_sort: stars
          plugin_topics_limit: 15
          plugin_music: no
          # Disabled: upstream still queries retired Projects (classic) fields
          # and embeds an error payload for this account.
          plugin_achievements: no
          plugin_calendar: yes
          plugin_calendar_limit: 1
          config_timezone: America/Los_Angeles
          config_padding: 10%

      - name: Collect personal metrics output
        id: collect_personal_metrics
        if: ${{ always() }}
        continue-on-error: true
        run: |
          set -euo pipefail
          cp /metrics_renders/.github/assets/img/metrics.svg ./.github/assets/img/metrics.svg

      - name: Validate and recover personal metrics output
        id: recover_personal_metrics
        if: ${{ always() }}
        run: |
          uv run python -m scripts.metrics_svg recover \
            ./.github/assets/img/metrics.svg \
            --previous "$RUNNER_TEMP/metrics-backups/metrics.svg"

      - name: Personal metrics (additional)
        id: lowlighter_metrics_additional
        continue-on-error: true
        uses: lowlighter/metrics@65836723097537a54cd8eb90f61839426b4266b6 # v3.34
        with:
          output_action: none
          filename: .github/assets/img/metrics.additional.svg
          token: ${{ steps.metrics_auth.outputs.has_valid_metrics_token == 'true' && secrets.METRICS_TOKEN || github.token }}
          base: ""
          config_timezone: America/Los_Angeles
          config_padding: 10%
          # Keep this card on stable GitHub-native panels; music/activity stay
          # off — supplemental cards own those surfaces.
          plugin_music: no
          plugin_activity: no
          plugin_stargazers: ${{ steps.metrics_auth.outputs.has_valid_metrics_token == 'true' && 'yes' || 'no' }}
          plugin_stargazers_charts: yes
          plugin_stars: ${{ steps.metrics_auth.outputs.has_valid_metrics_token == 'true' && 'yes' || 'no' }}
          plugin_stars_limit: ${{ steps.metrics_auth.outputs.has_valid_metrics_token == 'true' && '3' || '0' }}
          plugin_repositories: yes
          plugin_repositories_featured: "wyattowalsh/agents, wyattowalsh/nbadb, wyattowalsh/proxywhirl, wyattowalsh/mcp-crawl4ai, wyattowalsh/fl-mcp, wyattowalsh/listentropy, wyattowalsh/personal-website, wyattowalsh/mdxpad, wyattowalsh/ai-web-feeds, wyattowalsh/iina-plugin-bookmarks"
          plugin_people: yes
          plugin_people_limit: 12
          plugin_people_size: 24
          plugin_people_types: followers, following
          plugin_tweets: no
          plugin_gists: no
          plugin_habits: no

      - name: Collect additional metrics output
        id: collect_additional_metrics
        if: ${{ always() }}
        continue-on-error: true
        run: |
          set -euo pipefail
          cp /metrics_renders/.github/assets/img/metrics.additional.svg ./.github/assets/img/metrics.additional.svg

      - name: Validate and recover additional metrics output
        id: recover_additional_metrics
        if: ${{ always() }}
        run: |
          uv run python -m scripts.metrics_svg recover \
            ./.github/assets/img/metrics.additional.svg \
            --previous "$RUNNER_TEMP/metrics-backups/metrics.additional.svg"

      - name: Personal metrics (extra / overflow)
        id: lowlighter_metrics_extra
        continue-on-error: true
        uses: lowlighter/metrics@65836723097537a54cd8eb90f61839426b4266b6 # v3.34
        with:
          output_action: none
          filename: .github/assets/img/metrics.extra.svg
          token: ${{ steps.metrics_auth.outputs.has_valid_metrics_token == 'true' && secrets.METRICS_TOKEN || github.token }}
          base: ""
          config_timezone: America/Los_Angeles
          config_padding: 10%
          plugin_music: no
          plugin_activity: no
          plugin_habits: no
          plugin_gists: no
          plugin_tweets: no
          # Overflow panels split out to keep primary/additional README height manageable.
          plugin_reactions: yes
          plugin_reactions_limit: 100
          plugin_reactions_display: relative
          plugin_followup: yes
          plugin_followup_sections: repositories

      - name: Collect extra metrics output
        id: collect_extra_metrics
        if: ${{ always() }}
        continue-on-error: true
        run: |
          set -euo pipefail
          cp /metrics_renders/.github/assets/img/metrics.extra.svg ./.github/assets/img/metrics.extra.svg

      - name: Validate and recover extra metrics output
        id: recover_extra_metrics
        if: ${{ always() }}
        run: |
          uv run python -m scripts.metrics_svg recover \
            ./.github/assets/img/metrics.extra.svg \
            --previous "$RUNNER_TEMP/metrics-backups/metrics.extra.svg"

      # First-party only: Spotify/X via env: on this run step (never lowlighter with:).
      - name: Generate supplemental metrics cards
        id: generate_supplemental_metrics
        env:
          GITHUB_TOKEN: ${{ steps.metrics_auth.outputs.has_valid_metrics_token == 'true' && secrets.METRICS_TOKEN || github.token }}
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_KEY_SECRET: ${{ secrets.X_API_KEY_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
        run: |
          set -euo pipefail
          uv run python -m scripts.cli generate supplemental-metrics \
            --config-path config.yaml \
            --owner "${{ github.repository_owner }}" \
            --repo "${{ github.event.repository.name }}" \
            --output-dir .github/assets/img \
            --manifest-path "$RUNNER_TEMP/metrics-supplemental.manifest.json" \
            --x-handle "${{ github.repository_owner }}"

      - name: Validate supplemental metrics cards
        id: validate_supplemental_metrics
        if: ${{ always() }}
        run: |
          set -euo pipefail
          uv run python -m scripts.supplemental_metrics validate \
            --output-dir .github/assets/img \
            --manifest-path "$RUNNER_TEMP/metrics-supplemental.manifest.json"

      - name: Validate final metrics assets
        id: validate_final_metrics
        if: ${{ always() }}
        run: |
          set -euo pipefail
          uv run python -m scripts.metrics_svg validate ./.github/assets/img/metrics.svg
          uv run python -m scripts.metrics_svg validate ./.github/assets/img/metrics.additional.svg
          uv run python -m scripts.metrics_svg validate ./.github/assets/img/metrics.extra.svg
          uv run python -m scripts.supplemental_metrics validate \
            --output-dir .github/assets/img \
            --manifest-path "$RUNNER_TEMP/metrics-supplemental.manifest.json"

      - name: Summarize metrics asset health
        if: ${{ always() }}
        run: |
          uv run python - <<'PY'
          from pathlib import Path
          from scripts.metrics_svg import validate_svg_file

          for asset_name in (
              "metrics.svg",
              "metrics.additional.svg",
              "metrics.extra.svg",
              "metrics-habits.svg",
              "metrics-activity.svg",
              "metrics-music.svg",
              "metrics-posts.svg",
          ):
              path = Path(".github/assets/img") / asset_name
              result = validate_svg_file(path)
              print(f"{asset_name}: status={result.status.value} detail={result.detail}")
              if asset_name in {"metrics-music.svg", "metrics-posts.svg"} and result.status.value == "missing":
                  continue
              if not result.is_valid:
                  print(f"::error::{asset_name} is in degraded state ({result.status.value}).")
          PY

      - name: Upload profile metrics artifact
        if: ${{ success() && steps.validate_final_metrics.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: profile-metrics-${{ github.run_id }}
          path: |
            .github/assets/img/metrics.svg
            .github/assets/img/metrics.additional.svg
            .github/assets/img/metrics.extra.svg
            .github/assets/img/metrics-habits.svg
            .github/assets/img/metrics-activity.svg
            .github/assets/img/metrics-music.svg
            .github/assets/img/metrics-posts.svg
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  prepare-event-art-inputs:
    name: Prepare Event-Art Inputs
    runs-on: ubuntu-latest
    if: >-
      ${{
        github.event.inputs.metrics_probe_mode != 'true' &&
        !cancelled() &&
        (
          github.event_name != 'push' ||
          (
            github.event.head_commit.message != 'Updated with Dev Metrics' &&
            github.event.head_commit.message != 'chore(metrics): update generated metrics assets' &&
            github.event.head_commit.message != 'chore(data): update awesome-stars lists (languages.md, topics.md)' &&
            github.event.head_commit.message != 'chore(assets): update generated profile assets' &&
            github.event.head_commit.message != 'art: regenerate living-art assets' &&
            github.event.head_commit.message != 'chore(readme): update dynamic sections and skills badges'
          )
        )
      }}
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      styles: ${{ steps.contract.outputs.styles }}
      max_frames: ${{ steps.contract.outputs.max_frames }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          enable-cache: false

      - name: Install dependencies
        run: uv sync --locked

      - name: Fetch metrics
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          mkdir -p "$RUNNER_TEMP/living-art-inputs"
          uv run python -m scripts.fetch_metrics \
            --owner "$OWNER" \
            --repo "$REPO_NAME" \
            --output "$RUNNER_TEMP/living-art-inputs/metrics.json"

      - name: Fetch historical data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          uv run python -m scripts.fetch_history \
            --owner "$OWNER" \
            --repo "$REPO_NAME" \
            --output "$RUNNER_TEMP/living-art-inputs/history.json"

      - name: Resolve living-art runtime contract constants
        id: contract
        run: |
          uv run python - <<'PY'
          import json
          import os
          from scripts.art.artifacts import LIVING_ART_STYLE_KEYS
          from scripts.art.timelapse import DEFAULT_PUBLISHED_MAX_FRAMES

          styles = json.dumps(list(LIVING_ART_STYLE_KEYS), separators=(",", ":"))
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"styles={styles}\n")
              output.write(f"max_frames={DEFAULT_PUBLISHED_MAX_FRAMES}\n")
          PY

      - name: Upload living-art input bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: living-art-inputs-${{ github.run_id }}
          path: ${{ runner.temp }}/living-art-inputs
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  generate-event-art:
    name: Generate Event-Driven Artwork (${{ matrix.style }})
    runs-on: ubuntu-latest
    needs: prepare-event-art-inputs
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        style: ${{ fromJSON(needs.prepare-event-art-inputs.outputs.styles) }}
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Download living-art input bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        env:
          # Remove after actions/download-artifact#484 is fixed in a reviewed pin.
          NODE_OPTIONS: --disable-warning=DEP0005
        with:
          name: living-art-inputs-${{ github.run_id }}
          path: ${{ runner.temp }}/living-art-inputs

      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          enable-cache: false

      - name: Install dependencies
        run: uv sync --locked --all-extras

      - name: Install living-art media tools
        run: sudo apt-get update && sudo apt-get install -y librsvg2-bin gifsicle

      - name: Generate one canonical living-art GIF
        env:
          OWNER: ${{ github.repository_owner }}
          LIVING_ART_MAX_FRAMES: ${{ needs.prepare-event-art-inputs.outputs.max_frames }}
          LIVING_ART_OUTPUT_DIR: ${{ runner.temp }}/living-art-output-${{ matrix.style }}
          LIVING_ART_STYLE: ${{ matrix.style }}
        run: |
          uv run python -m scripts.cli generate living-art \
            --profile "$OWNER" \
            --metrics-path "$RUNNER_TEMP/living-art-inputs/metrics.json" \
            --history-path "$RUNNER_TEMP/living-art-inputs/history.json" \
            --only "$LIVING_ART_STYLE" \
            --max-frames "$LIVING_ART_MAX_FRAMES" \
            --size 400 \
            --workers 4 \
            --output-dir "$LIVING_ART_OUTPUT_DIR"

      - name: Validate isolated living-art GIF
        env:
          LIVING_ART_OUTPUT_DIR: ${{ runner.temp }}/living-art-output-${{ matrix.style }}
          LIVING_ART_STYLE: ${{ matrix.style }}
        run: |
          uv run python - <<'PY'
          import os
          from pathlib import Path
          from scripts.art.artifacts import (
              LIVING_ART_BYTE_BUDGETS,
              build_living_art_manifest,
              validate_living_art_byte_budgets,
          )

          style = os.environ["LIVING_ART_STYLE"]
          expected_name = f"living-{style}.gif"
          budget = LIVING_ART_BYTE_BUDGETS[expected_name]
          manifest = build_living_art_manifest(
              Path(os.environ["LIVING_ART_OUTPUT_DIR"])
          )
          validate_living_art_byte_budgets(
              manifest,
              budgets={expected_name: budget},
              total_budget=budget,
          )
          asset = manifest["assets"][0]
          print(
              f"Validated {expected_name}: frames={asset['frames']}, "
              f"runtime_ms={asset['duration_ms']}, bytes={asset['bytes']}"
          )
          PY

      - name: Upload isolated living-art GIF
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: living-art-style-${{ github.run_id }}-${{ matrix.style }}
          path: ${{ runner.temp }}/living-art-output-${{ matrix.style }}/living-${{ matrix.style }}.gif
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
          overwrite: true

  assemble-event-art:
    name: Assemble Event-Driven Artwork
    runs-on: ubuntu-latest
    needs: generate-event-art
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Download isolated living-art GIFs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        env:
          # Remove after actions/download-artifact#484 is fixed in a reviewed pin.
          NODE_OPTIONS: --disable-warning=DEP0005
        with:
          pattern: living-art-style-${{ github.run_id }}-*
          path: ${{ runner.temp }}/living-art-parts
          merge-multiple: true

      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          enable-cache: false

      - name: Install dependencies
        run: uv sync --locked

      - name: Stage exact-six living-art artifact
        run: |
          uv run python - <<'PY'
          import os
          from pathlib import Path

          from scripts.art.artifacts import stage_living_art_fleet

          manifest = stage_living_art_fleet(
              Path(os.environ["RUNNER_TEMP"]) / "living-art-parts",
              Path(os.environ["RUNNER_TEMP"]) / "living-art-stage",
          )
          print(
              "Staged exact living-art fleet: "
              f"{manifest['total_assets']} assets, "
              f"{manifest['total_bytes']} bytes"
          )
          PY

      - name: Summarize exact-six living-art artifact
        run: |
          {
            echo "# Living-art artifact summary"
            echo
            echo "## Canonical primary GIFs"
            while IFS= read -r file; do
              size=$(wc -c < "$file")
              echo "- $(basename "$file") (${size} bytes)"
            done < <(find "$RUNNER_TEMP/living-art-stage" -maxdepth 1 -type f | sort)
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload living-art staging bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: living-art-stage-${{ github.run_id }}
          path: ${{ runner.temp }}/living-art-stage
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
          overwrite: true


  finalize:
    # Single first-party git writer: downloads generator artifacts and commits/pushes.
    # Graph: assets ∥ art ∥ metrics ∥ waka → finalize (apply waka zone, then README/skills)
    name: Finalize Profile Asset Commits
    runs-on: ubuntu-latest
    needs:
      - update-starred-lists
      - generate-assets
      - assemble-event-art
      - generate-profile-metrics
      - update-readme-wakatime
    if: >-
      ${{
        github.event.inputs.metrics_probe_mode != 'true' &&
        !cancelled() &&
        needs.update-starred-lists.result == 'success' &&
        needs.generate-assets.result == 'success' &&
        needs.assemble-event-art.result == 'success' &&
        needs.generate-profile-metrics.result == 'success' &&
        needs.update-readme-wakatime.result == 'success' &&
        (
          github.event_name != 'push' ||
          (
            github.event.head_commit.message != 'Updated with Dev Metrics' &&
            github.event.head_commit.message != 'chore(metrics): update generated metrics assets' &&
            github.event.head_commit.message != 'chore(data): update awesome-stars lists (languages.md, topics.md)' &&
            github.event.head_commit.message != 'chore(assets): update generated profile assets' &&
            github.event.head_commit.message != 'art: regenerate living-art assets' &&
            github.event.head_commit.message != 'chore(readme): update dynamic sections and skills badges'
          )
        )
      }}
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Download starred lists artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
