name: CI

on:
  pull_request:
  push:
    branches:
      - master
      - main
      - dev

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-and-test:
    name: Python Lint and Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0

      - name: Install dependencies
        run: uv sync --locked --all-extras

      - name: Lint
        run: uv run readme dev lint

      - name: Test
        run: uv run readme dev test

  docs:
    name: Docs Test, Typecheck, and Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: docs
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm from the docs package policy
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          package_json_file: docs/package.json

      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: docs/pnpm-lock.yaml

      - name: Install docs dependencies
        run: pnpm install --frozen-lockfile

      - name: Test docs server contracts
        run: pnpm test

      - name: Assert docs type generation starts clean
        run: |
          test ! -e .next
          test ! -e .source

      - name: Generate and typecheck docs
        run: pnpm typecheck

      - name: Verify generated docs type surfaces
        run: |
          test -s .next/types/routes.d.ts
          test -s .next/types/root-params.d.ts
          test -s .next/types/validator.ts
          test -s .source/server.ts

      - name: Build docs
        run: pnpm build
